# 2.6.0 / 3.0.0 (G-03): named regions that are not one admin unit, as lists of members. A member is an ISO 3166-1 country (KE), an ISO
# 3166-2 admin-1 area (US-WA, DE-BY, AT-8), or admin-2 areas inside one admin-1 area ({in: US-ID, names: [...]}). `codes` are admin codes the
# region answers to (admin: GB-SCT). Names match case-insensitively, with aliases. A person adds their own in <work folder>/.geo-mapping/regions.yaml
# (same shape; theirs win on a clash). Starter list (owner decision O7): mostly outside the United States.
- name: Idaho Panhandle
  aliases: [North Idaho, Northern Idaho]
  members: [{in: US-ID, names: [Benewah, Bonner, Boundary, Clearwater, Idaho, Kootenai, Latah, Lewis, Nez Perce, Shoshone]}]
  note: the ten northern counties (the common definition); the five-county definition is "Idaho Panhandle (5 counties)"
- name: Idaho Panhandle (5 counties)
  aliases: [Idaho Panhandle north, Inland Northwest Idaho]
  members: [{in: US-ID, names: [Benewah, Bonner, Boundary, Kootenai, Shoshone]}]
  note: the five northernmost counties
