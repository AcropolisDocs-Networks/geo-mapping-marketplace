# Fonts for scripts Inter does not cover (1.5.0, R3-SCRIPT). Inter covers Latin, Greek and Cyrillic; a label in another script is set in the Noto
# family below, shaped with HarfBuzz (uharfbuzz) and drawn as outlined paths with the words kept in <title> (spike S4). The fonts are not
# bundled: `doctor --fonts arab,hebr,deva,hani` fetches the pinned file into the font cache (.geo-mapping/fonts/noto/), checks its SHA-256 and
# the OFL text, and the terms register lists it. Pinned to commits of github.com/notofonts (read 2026-11-10 with git ls-remote).
