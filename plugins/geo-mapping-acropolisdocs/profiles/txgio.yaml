# Shipped service profile (read-only; see service_registry.py). Verified 2026-11-04 from the build environment.
profile: txgio
type: arcgis-rest
base_url: https://feature.geographic.texas.gov/arcgis/rest/services
auth:
  method: none
network:
  route: mcp
  public: true
limits:
  max_features_per_request: 2000
  server_max_features: 2000
  max_concurrency: 1
  timeout_s: 60
  max_bytes: 50000000
  max_total_features: 200000
cors:
  browser_ok: unknown
  mixed_content_ok: false
  checked_on: null
license:
  default: open
  confidential: false
  attribution: 'Source: Texas Geographic Information Office.'
host_visibility: shown
host_confirmed_on: '2026-11-04'
verified_on: '2026-11-04'
notes: 'Texas Geographic Information Office (TxGIO, formerly TNRIS) feature services. ArcGIS Server with folders Address_Points, Basemap, City_Boundaries,
  Hydrography, Parcels, Utilities and the district boundaries folder. Bulk downloads live in the TxGIO data warehouse (S3 bucket tnris-data-warehouse);
  data.tnris.org did not answer through the build proxy. Licence varies by layer. Shipped with the plugin (M13), read-only: a profile of the same
  name saved in the working folder overrides it.'
