# Shipped service profile (read-only; see service_registry.py). Verified 2026-11-04 from the build environment.
profile: azgeo
type: arcgis-rest
base_url: https://azgeo.az.gov/arcgis/rest/services
auth:
  method: none
network:
  route: mcp
  public: true
limits:
  max_features_per_request: 2000
  server_max_features: 2000
  max_concurrency: 1
  timeout_s: 60
  max_bytes: 50000000
  max_total_features: 200000
cors:
  browser_ok: unknown
  mixed_content_ok: false
  checked_on: null
license:
  default: open
  confidential: false
  attribution: 'Source: AZGeo Data Hub, Arizona Geographic Information Council.'
host_visibility: shown
host_confirmed_on: '2026-11-04'
verified_on: '2026-11-04'
notes: 'AZGeo (Arizona Geographic Information Council) ArcGIS Server. State ArcGIS Server with folders 911, adot, asld, dffm, imagery, sco, SHPO.
  Discovery: the AZGeo Data Hub (azgeo-data-hub-agic.hub.arcgis.com, orgId MrgGZS7oC7drh1E8). Licence varies by layer: read each item''s terms
  before external use. Shipped with the plugin (M13), read-only: a profile of the same name saved in the working folder overrides it.'
