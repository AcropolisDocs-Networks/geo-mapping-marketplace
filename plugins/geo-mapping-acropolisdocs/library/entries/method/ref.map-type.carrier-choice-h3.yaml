id: ref.map-type.carrier-choice-h3
type: map-type
rev: 1
status: active
title: Carrier choice on the H3 grid
summary: How many carriers (or providers) cover each hexagon of a region, from coverage published on H3, with the empty grid drawn as outlines over
  the relief; written by recipe.py from data/recipes/carrier-choice-h3.yaml.
tags:
  use_for:
  - coverage-footprint
  - choropleth
  avoid_for:
  - engineering-grade
use_when:
- The message is how many carriers serve each part of a region (5G choice, competition), from coverage that is published on H3 or can be put on it.
- 'One build for any region: region: {place: ...} or {admin: ...}; the adapter fetches every state or country partition the region touches.'
avoid_when:
- The coverage is measured performance rather than filings; say which it is in the subtitle.
- One carrier's footprint only; use the share map (h3.agg share) instead.
pairs_with:
- ref.statistic.us.coverage.fcc-bdc-mobile-h3
chooses_when:
  message_type:
  - availability
  data_shape:
  - polygon-footprint
  - grid-count
requires:
  data_shape: see chooses_when
  join_key: false
recommended:
  role: choropleth
  classification: discrete
  recipe: data/recipes/carrier-choice-h3.yaml
  wording: reported coverage
guarded_by:
- MAP-TEL-003
- MAP-HEX-002
license:
  class: open
  redistribute_ok: true
  commercial_ok: true
  bulk_ok: true
maintenance:
  owner: acropolisdocs
  reviewed_on: '2026-11-20'
  verify_by: '2027-11-20'
  check: recipe.py make carrier-choice-h3 writes a MapSpec that builds the Day 20 Washington counts (tests/test_release_260.py)
  changelog:
  - rev: 1
    date: '2026-11-20'
    note: 'Active (2.6.0, H-13): the Day 20 hexagon map as a recipe; the Washington roll-up matches day20-notes.md (24,923 / 8,071 / 4,197 / 461).'
