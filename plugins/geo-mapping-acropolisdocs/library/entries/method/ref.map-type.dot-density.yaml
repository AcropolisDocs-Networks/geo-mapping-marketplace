id: ref.map-type.dot-density
type: map-type
rev: 1
status: draft
title: Dot density
summary: Scatters dots in each area, one dot per fixed quantity, to show where a population or count concentrates.
tags:
  use_for:
  - dot-density
  avoid_for: []
use_when:
- The message is about where counts concentrate, not about a rate per area.
avoid_when:
- The reader needs exact values per area.
- The dots would be placed at random and the audience may read them as real locations.
