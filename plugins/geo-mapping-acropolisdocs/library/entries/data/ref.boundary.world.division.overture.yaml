id: ref.boundary.world.division.overture
type: boundary
rev: 2
status: active
title: Overture Maps divisions (administrative areas)
summary: Countries, regions (states, provinces), counties and localities with names and hierarchy from the Overture divisions theme (division and division_area
  types), GeoParquet on S3.
tags:
  geography:
  - world
  level:
  - country
  - state
  - county
  - place
  domain:
  - general
  use_for:
  - choropleth
  - context-basemap
  - join-key
  - label-reference
  avoid_for:
  - engineering-grade
  - site-precision
  - legal-boundary
  scale:
  - world
  - national
  - regional
  - state
  detail:
  - detailed
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - monthly
  tier:
  - T2
  license_class:
  - share-alike
  quality:
  - community
use_when:
- A consistent world or multi-country admin hierarchy (country > region > county > locality) with one id scheme, for an international atlas.
- Locality polygons for cities outside the United States where no national file is at hand.
avoid_when:
- 'The map is of the United States, Canada or Mexico for a client: the national statistical agencies'' files carry the official codes.'
- 'Legal boundaries are implied: divisions come from OpenStreetMap and other open sources.'
distinct_from:
- id: ref.boundary.world.country.geoboundaries
  why: geoBoundaries cites an official source per country
- id: ref.boundary.world.state.ne10
  why: Natural Earth is generalized and public domain
- id: ref.boundary.world.admin.gadm41
  why: GADM is restricted-license
- id: ref.boundary.world.country.ne110
  why: bundled generalized countries
- id: ref.boundary.world.state.ne50
  why: bundled generalized admin-1
join:
  key: id
  type: string
  note: Overture GERS id; subtype (country, region, county, locality), country (ISO 3166-1 alpha-2), region (ISO 3166-2), names.primary. division_area holds
    the polygons, division the points and hierarchy.
crs: EPSG:4326
delivery:
  mode: user-supplied
  format: GeoParquet (S3, read with pyarrow or DuckDB; filter on subtype and country)
  note: 'Overture publishes each release as GeoParquet on S3: s3://overturemaps-us-west-2/release/<release>/theme=<theme>/type=<type>/*.parquet (listing
    verified 2026-11-04: releases 2026-09-23.0, 2026-09-23.1, 2026-10-21.0; themes addresses, base, buildings, divisions, places, transportation). Files
    are 700 to 800 MB each, so read them with a bbox filter rather than downloading: pyarrow.dataset(''s3://overturemaps-us-west-2/release/2026-10-21.0/theme=divisions/type=division_area/'',
    filesystem=S3FileSystem(anonymous=True, region=''us-west-2'')).to_table(filter=(bbox.xmin > W) & (bbox.xmax < E) & ...), or DuckDB: SELECT ... FROM
    read_parquet(''s3://.../theme=divisions/type=division_area/*'', hive_partitioning=1) WHERE bbox.xmin > W AND ...; save the result as GeoParquet and
    supply it.'
  columns:
  - id
  - geometry
  - bbox
  - version
  - sources
  - subtype
  - class
  - names
  - country
  - region
  - division_id
  - is_land
  - is_territorial
source:
  publisher: Overture Maps Foundation
  product: Overture divisions theme, release 2026-10-21.0
  url: https://overturemaps-us-west-2.s3.amazonaws.com/?list-type=2&prefix=release/2026-10-21.0/&delimiter=/
url_verified_on: '2026-11-04'
vintage:
  current: 2026-10-21.0
  cadence: monthly
license:
