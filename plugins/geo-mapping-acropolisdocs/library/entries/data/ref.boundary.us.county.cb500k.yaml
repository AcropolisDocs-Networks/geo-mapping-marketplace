use_when:
- A choropleth of one state or a few states, where the 1:20,000,000 county outlines look coarse.
- A metro or multi-county map that needs recognizable county shapes and still renders fast.
avoid_when:
- The map is national; the bundled 1:20,000,000 counties are smaller and quicker.
- The map needs exact legal boundaries or site-level precision; these outlines are simplified and clipped to the coast.
