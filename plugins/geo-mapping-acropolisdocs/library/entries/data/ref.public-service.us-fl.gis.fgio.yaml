id: ref.public-service.us-fl.gis.fgio
type: public-service
rev: 1
status: active
title: Florida Geospatial Open Data Portal (FGIO) and FGDL
summary: 'Florida''s Geographic Information Office portal (orgId Gh9awoU677aKree0): ArcGIS Hub discovery and 94 hosted feature services (911 regions, statewide
  parcels, coastal layers); the Florida Geographic Data Library (fgdl.org) and FDEP''s ArcGIS Server are the other state sources.'
