id: ref.public-service.us.broadband.fcc-bdc-api
type: public-service
rev: 3
status: active
title: FCC Broadband Data Collection public data API
summary: The FCC National Broadband Map's public data API (availability and provider files by as-of date), signed with the person's FCC username and an
  API token.
tags:
  geography:
  - us
  level:
  - block-group
  - state
  domain:
  - telecom
  use_for:
  - coverage-footprint
  - choropleth
  - market-rollup
  avoid_for:
  - engineering-grade
  - site-precision
  scale:
  - national
  - state
  - metro
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - irregular
  tier:
  - T2
  license_class:
  - public-domain
  quality:
  - authoritative
use_when:
- Listing and downloading BDC availability or provider files for a state as of a filing date, with the person's own username and token (the fcc-bdc credential,
  kind userkey).
avoid_when:
- 'Calls are limited to 10 a minute on each API: a state-by-state pull lists once and then downloads one file at a time.'
- 'A summary layer is enough: ref.statistic.us.broadband.fcc-bdc-summary describes the summary layout.'
delivery:
  mode: service
  protocol: rest-json
  requires_credential:
    name: fcc-bdc
    kind: userkey
    class: secret
    host: bdc.fcc.gov
    inject:
      user:
        header: username
      key:
        header: hash_value
    reject:
      status:
      - 401
      - 403
    probe: https://bdc.fcc.gov/api/public/map/listAsOfDates
    signup_url: https://broadbandmap.fcc.gov/login
    free: true
    limits: 10 calls a minute on each API (FCC National Broadband Map Public Data API Specifications and Instructions, 8 June 2026)
    note: Sign in at broadbandmap.fcc.gov/login with your FCC User Registration account, choose your username at the top right, Manage API Access, Generate
      (agree to the Terms of Use the first time); the file holds username:token. The FCC may revoke a token at any time.
  request: https://bdc.fcc.gov/api/public/map/listAsOfDates
  note: 'From the FCC specification (8 June 2026): GET on host bdc.fcc.gov with headers username and hash_value. /api/public/map/listAsOfDates; /api/public/map/downloads/listAvailabilityData/{as_of_date}
    (optional category Summary, State or Provider, subcategory, technology_type Fixed Broadband, Mobile Broadband or Mobile Voice, speed_tier); /api/public/map/downloads/listChallengeData/{as_of_date};
    /api/public/map/downloads/downloadFile/{availability|challenge}/{file_id}[/{1 shapefile | 2 GeoPackage}]; the Funding Map APIs under /api/public/fundingmap/.
    OpenAPI YAML: us-fcc.box.com/v/bdc-public-data-api-swagger. The broadbandmap.fcc.gov web pages refuse scripted requests (403); the API host does not.'
  api:
    host: bdc.fcc.gov
    requests:
    - method: GET
      path: /api/public/map/listAsOfDates
    - method: GET
      path: /api/public/map/downloads/listAvailabilityData/{as_of_date}
    - method: GET
      path: /api/public/map/downloads/listChallengeData/{as_of_date}
    - method: GET
      path: /api/public/map/downloads/downloadFile/{kind}/{file_id}
    - method: GET
      path: /api/public/map/downloads/downloadFile/{kind}/{file_id}/{fmt}
    limits:
      calls_per_minute: 10
  tool: fcc_bdc
source:
  publisher: Federal Communications Commission
  product: Broadband Data Collection public data API
  url: https://us-fcc.app.box.com/v/bdc-public-data-api-spec
url_verified_on: '2026-11-10'
vintage:
  current: per as-of date
  cadence: irregular
license:
  class: public-domain
  redistribute_ok: true
  commercial_ok: true
  bulk_ok: true
  attribution_text: 'Source: FCC National Broadband Map (Broadband Data Collection).'
  note: FCC public data; the API Terms of Use are agreed when the token is generated.
  terms_accepted: the FCC API Terms of Use, agreed when the token is generated (Manage API Access)
maintenance:
  owner: acropolisdocs
  reviewed_on: '2026-11-10'
  verify_by: '2027-02-10'
  changelog:
  - rev: 1
    date: '2026-11-07'
    note: 'Draft (reference library additions, P2): the endpoint answered 401 without credentials on 2026-11-07; the token page is documented by a client
      library; header names unconfirmed.'
  - rev: 2
    date: '2026-11-10'
    note: 'Active: the FCC Public Data API specification (8 June 2026) read 2026-11-10 - host bdc.fcc.gov (rev 1 had broadbandmap.fcc.gov), headers username
      and hash_value confirmed, 10 calls a minute, the list and download paths recorded; bdc.fcc.gov answers 401 without credentials.'
  - rev: 3
    date: '2026-11-10'
    note: '1.3.0 (R1-FCC): the list and download GETs declared in delivery.api with the 10-a-minute limit (shared across processes by ratelimit.py); fcc_bdc.py
      uses them; terms_accepted recorded for the terms register.'
