  - T2
  license_class:
  - public-domain
  quality:
  - authoritative
use_when:
- Rolling county data up to metro areas, or labelling counties with their metro.
- Joining a county-keyed table to the metro boundary file.
avoid_when:
- The need is a county list for a state; counties outside any metro or micro area are not in this table.
- The delineation is required to be current as of a later OMB bulletin; this file is the July 2023 delineation.
pairs_with:
- ref.boundary.us.cbsa.cb500k
- ref.boundary.us.county.cb
join:
  key: county_geoid
  type: string
  width: 5
  note: State FIPS + county FIPS; joins to GEOID in the county files. cbsa_code (string, 5) joins to GEOID in the CBSA file.
  pattern: ^\d{5}$
