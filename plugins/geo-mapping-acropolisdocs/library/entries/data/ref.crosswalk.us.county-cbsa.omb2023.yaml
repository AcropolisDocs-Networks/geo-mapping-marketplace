id: ref.crosswalk.us.county-cbsa.omb2023
type: crosswalk
rev: 1
status: active
title: US county to metro/micro area crosswalk (OMB July 2023 delineations)
summary: Which county belongs to which core-based statistical area and combined statistical area, 1,915 counties, as a small table.
tags:
  geography:
  - us
  level:
