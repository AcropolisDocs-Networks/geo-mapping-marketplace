use_when: ['A regional map (1:10,000,000 to 1:1,500,000) whose coast should be closer than the Natural Earth 1:10m coast; fetched once (24 MB), then cached.']
avoid_when: ['A city map finer than 1:1,500,000: the polygons are simplified for zoom 9 (about 300 m); use Overture or TIGER ground.']
