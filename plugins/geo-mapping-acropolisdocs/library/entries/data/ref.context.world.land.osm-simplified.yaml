status: active
title: OpenStreetMap simplified land polygons (osmdata.openstreetmap.de)
summary: Every land area of the world (continents and islands) from the OpenStreetMap coastline, simplified for zoom levels 0 to 9; the ground of
  regional maps between 1:10,000,000 and 1:1,500,000, with the water as its inverse in the window.
