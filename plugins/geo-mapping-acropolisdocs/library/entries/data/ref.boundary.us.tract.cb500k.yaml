use_when:
- A tract-level choropleth for a state or metro area from an ACS table or a client rate.
- Aggregating site or customer points to tracts to compare small areas.
avoid_when:
- The map is national; 85,000 polygons are slow and unreadable at that scale. Use counties.
- Tract-level values are small counts; margins of error in ACS estimates can be larger than the differences shown.
