id: ref.statistic.us.acs5.broadband
type: statistic
rev: 1
status: active
title: ACS 5-year estimates, internet subscriptions (table B28002)
summary: 'Households by presence and type of internet subscription (B28002): no subscription, broadband of any type, cellular, cable/fiber/DSL, satellite.'
tags:
  geography:
  - us
  level:
  - state
  - county
  - cbsa
  - tract
  - block-group
  - zcta
  domain:
  - demographics
  use_for:
  - choropleth
  - market-rollup
  avoid_for:
  - legal-boundary
  scale:
  - national
  - regional
  - state
  - metro
  - local
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - annual
  tier:
  - T1
  - T2
  license_class:
  - public-domain
  quality:
  - authoritative
use_when:
- A choropleth or table of acs 5-year estimates, internet subscriptions by state, county, tract or block group, with margins of error.
avoid_when:
- 'Small tracts or block groups without the margins shown: the estimates can be too noisy to classify (MAP-ACS-004 counts them).'
- 'The map needs this year''s figures: ACS 5-year estimates average five years.'
pairs_with:
- ref.boundary.us.county.cb
- ref.boundary.us.tract.cb500k
join:
  key: GEO_ID parts
  type: string
  width: 5
  note: The API returns state and county as separate columns; build the county GEOID as state + county (2 + 3 characters), keeping leading zeros.
delivery:
  mode: service
  tool: census_query
  protocol: rest-json
  query:
    dataset: acs/acs5
    year: 2024
    group: B28002
    level: tract
    moe: true
    route: auto
  note: 'census_query.py fetches it by variable: the Census Data API with the person''s census key, or without one the ACS table-based Summary File (www2.census.gov).
    Day 9''s no-broadband share: (B28002_001E - B28002_004E) / B28002_001E * 100.'
source:
  publisher: US Census Bureau
  product: American Community Survey 5-Year Estimates 2020-2024, table B28002
  url: https://api.census.gov/data/2024/acs/acs5/groups/B28002.json
url_verified_on: '2026-11-10'
vintage:
  current: 2020-2024
  cadence: annual
license:
