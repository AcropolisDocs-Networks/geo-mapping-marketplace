id: ref.gazetteer.world.place.wof
type: gazetteer
rev: 1
status: draft
title: Who's On First gazetteer
summary: An open gazetteer of places with stable ids, hierarchies and concordances to other id systems (GeoNames, Wikidata, Quattroshapes), published as
  per-country SQLite databases and GeoJSON; CC BY 4.0 with per-source terms.
tags:
  geography:
  - world
  level:
  - place
  - country
  - state
  - county
  domain:
  - general
  use_for:
