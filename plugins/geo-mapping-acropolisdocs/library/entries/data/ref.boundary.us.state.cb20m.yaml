use_when:
- Rolling a metric up by state on a national or regional map.
- A choropleth that joins to a client table on the two-digit state FIPS code or the postal abbreviation.
avoid_when:
- The map needs exact legal boundaries or shoreline detail; the 1:20,000,000 files are generalized and clipped to the coast.
- The map is of one state or a metro area; use counties or detailed boundaries.
pairs_with:
- ref.boundary.us.county.cb
distinct_from:
- id: ref.boundary.world.state.ne50
  why: worldwide, lower fidelity, no FIPS codes
join:
  key: GEOID
  type: string
  width: 2
  note: Keep leading zeros. STUSPS holds the two-letter postal code. Includes DC (11) and Puerto Rico (72).
  pattern: ^\d{2}$
crs: EPSG:4269
