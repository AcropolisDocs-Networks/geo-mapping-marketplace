id: ref.boundary.us.state.cb20m
type: boundary
rev: 2
status: active
title: US states, generalized (Census cartographic boundary)
summary: Generalized state polygons, with the District of Columbia and Puerto Rico, for national and regional thematic maps.
tags:
  geography:
