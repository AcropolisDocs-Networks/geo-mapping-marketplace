type: boundary
rev: 1
status: active
title: US American Indian, Alaska Native and Native Hawaiian areas, 1:500,000 (Census cartographic boundary)
summary: Federal and state reservations, off-reservation trust lands, tribal statistical areas and Hawaiian home lands as simplified polygons, for tribal-land
  context and the tribal-lands rows in broadband programs.
