use_when:
- Showing tribal lands under a coverage, BEAD or tower map, or counting sites and locations inside each area.
- A regulatory exhibit that needs the Census-defined tribal areas with their AIANNH codes.
avoid_when:
- The map needs legal reservation boundaries or trust-land parcels; these are generalized Census areas, and the Bureau of Indian Affairs holds the legal
  record.
- The map is local and needs the full-resolution outline; the TIGER/Line AIANNH file holds that.
