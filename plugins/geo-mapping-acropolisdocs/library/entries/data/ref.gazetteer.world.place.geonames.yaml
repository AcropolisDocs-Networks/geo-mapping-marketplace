use_when:
- A map outside North America that needs more place labels than the bundled Natural Earth gazetteer gives.
- A lookup of a city's coordinates, country and population for a locator inset or a label.
avoid_when:
- 'The map is of the United States and needs official names: Census places (ref.boundary.us.place.cb500k) carry the legal names and codes.'
- 'The product is redistributed without credit: the CC BY 4.0 licence requires attribution.'
delivery:
  mode: fetch
  format: zip holding cities15000.txt (tab-delimited, UTF-8, no header; 19 columns per the dump readme)
  member: cities15000.txt
  header: false
  delimiter: \t
  geometry_columns:
    lon: longitude
    lat: latitude
  rolling: true
  features: 34204
  features_tolerance_pct: 5
  note: 'ref_fetch.py fetch ref.gazetteer.world.place.geonames downloads https://download.geonames.org/export/dump/cities15000.zip (3.2 MB), reads the
    header-less tab file inside it by the 19 declared columns and caches the places as points (longitude, latitude; EPSG:4326). GeoNames rewrites the
    dump every day, so the entry is rolling: the hash and count are those of the copy verified on 2026-11-05 (34,204 places), and a later copy that
    differs is used and reported, with the count held within 5 percent.'
  columns:
  - geonameid
  - name
  - asciiname
  - alternatenames
  - latitude
  - longitude
  - feature_class
  - feature_code
  - country_code
  - cc2
  - admin1_code
  - admin2_code
  - admin3_code
  - admin4_code
  - population
  - elevation
  - dem
  - timezone
  - modification_date
  size_mb: 3.21
