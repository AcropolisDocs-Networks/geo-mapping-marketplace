use_when:
- Relief, a profile or a line of sight inside Japan (terrain.source auto).
avoid_when:
- 'A window outside Japan: the next source in the chain is used.'
crs: EPSG:4326
delivery:
  mode: fetch
  url_template: https://cyberjapandata.gsi.go.jp/xyz/dem_png/{z}/{x}/{y}.png
  format: 'PNG tiles: x = R*65536 + G*256 + B; x < 2^23 is x*0.01 m, above it (x - 2^24)*0.01 m; 2^23 is no data'
  cap: 64 tiles a map, zoom 14 or lower
  note: A zoom-14 tile over Tokyo answered 200 (50,651 bytes) on 2026-11-20.
source:
  publisher: Geospatial Information Authority of Japan
  product: GSI elevation tiles (標高タイル, dem_png)
  url: https://maps.gsi.go.jp/development/ichiran.html
  terms_url: https://www.gsi.go.jp/kikakuchousei/kikakuchousei40182.html
url_verified_on: '2026-11-20'
vintage:
  current: dem_png (DEM10B)
  cadence: irregular
license:
  class: attribution
  redistribute_ok: true
  commercial_ok: true
  bulk_ok: true
  attribution_text: 'Elevation: Geospatial Information Authority of Japan (GSI) elevation tiles (国土地理院).'
  note: GSI's content terms allow reuse, commercial included, with the source named (compatible with CC BY 4.0).
maintenance:
  owner: acropolisdocs
  reviewed_on: '2026-11-20'
  verify_by: '2027-11-20'
  check:
    kind: http_head
    url: https://cyberjapandata.gsi.go.jp/xyz/dem_png/14/14552/6451.png
    expect: 200
  changelog:
