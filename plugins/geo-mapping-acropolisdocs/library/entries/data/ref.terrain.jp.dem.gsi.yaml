id: ref.terrain.jp.dem.gsi
type: terrain
rev: 1
status: active
title: GSI Japan elevation tiles (dem_png, about 10 m)
summary: 'The Geospatial Information Authority of Japan''s elevation tiles, 256 px PNGs at zoom 14 (about 10 m), decoded as GSI documents: the relief and
  analysis source inside Japan from 3.1.0.'
tags:
  geography:
  - jp
  level:
  - grid
  domain:
  - general
  use_for:
  - context-basemap
  - site-map
  avoid_for:
