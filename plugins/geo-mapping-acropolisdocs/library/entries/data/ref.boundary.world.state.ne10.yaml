id: ref.boundary.world.state.ne10
type: boundary
rev: 1
status: active
title: States and provinces worldwide, 1:10,000,000 (Natural Earth admin-1)
summary: 4,596 first-level divisions (US states, Canadian provinces, Mexican states and the rest of the world) with ISO 3166-2 codes, postal abbreviations
  and names in many languages, fetched from Natural Earth 10m.
