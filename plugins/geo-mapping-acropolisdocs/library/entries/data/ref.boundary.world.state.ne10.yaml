use_when:
- A North American market map that needs Canadian provinces and Mexican states beside US states from one file, joined on iso_3166_2 (CA-ON, MX-SON, US-AZ).
- A sharper admin-1 outline than the bundled 1:50,000,000 file for a regional or national map outside the United States.
avoid_when:
- 'The map is of the United States only and goes to a client or regulator: the Census state file carries the official boundaries and FIPS codes.'
- 'The map is metro or local: 1:10,000,000 lines look coarse at that scale.'
pairs_with:
- ref.boundary.world.country.ne110
- ref.boundary.us.state.cb20m
distinct_from:
- id: ref.boundary.world.state.ne50
  why: 'the bundled 1:50m file: coarser, no network needed'
- id: ref.boundary.world.country.geoboundaries
  why: geoBoundaries carries official per-country sources and deeper levels
- id: ref.boundary.world.admin.gadm41
  why: GADM is restricted-license and far more detailed
join:
  key: iso_3166_2
  type: string
  note: ISO 3166-2 code such as US-AZ, CA-ON, MX-SON; postal holds the two-letter abbreviation, adm0_a3 the country, name_en the English name.
crs: EPSG:4326
delivery:
  mode: fetch
  format: Shapefile (zip)
  size_mb: 14.22
  features: 4596
  columns:
  - featurecla
  - scalerank
  - adm1_code
  - iso_3166_2
  - iso_a2
  - name
  - name_en
  - name_local
  - type_en
  - postal
  - admin
  - adm0_a3
  - region
  - latitude
  - longitude
  - wikidataid
  - ne_id
  note: The shapefile carries 120 attribute columns (names in 25 languages and per-country feature-class flags); the list above is the useful subset.
