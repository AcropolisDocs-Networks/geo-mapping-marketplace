rev: 1
status: draft
title: Submarine cable systems and landing points (TeleGeography Submarine Cable Map)
summary: Routes of the world's submarine telecom cable systems (in service and planned) and their landing points, as drawn on TeleGeography's free
  Submarine Cable Map; the geocoded route data is licensed by TeleGeography for a fee.
