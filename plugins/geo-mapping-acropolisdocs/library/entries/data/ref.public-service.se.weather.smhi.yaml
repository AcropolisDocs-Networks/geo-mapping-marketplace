id: ref.public-service.se.weather.smhi
type: public-service
rev: 1
status: active
title: SMHI Open Data (Sweden weather observations)
summary: 'Weather observations from Swedish Meteorological and Hydrological Institute (SMHI), keyless open data: JSON: every station''s latest value for
  one parameter (1 air temperature, 7 precipitation), with latitude and longitude.'
tags:
  geography:
  - se
  level:
  - site
  domain:
  - weather
  use_for:
  - site-map
  - density-surface
  avoid_for:
  - engineering-grade
  - site-precision
  scale:
  - national
  - regional
  - metro
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - live
  tier:
  - T2
  license_class:
  - attribution
  quality:
  - authoritative
use_when:
- Observed weather across Sweden (temperature, precipitation, wind at the national network's stations), keyless.
avoid_when:
- 'Forecast fields: those are the SMHI forecast API, not this one.'
delivery:
  mode: service
  protocol: rest-json
  request: https://opendata-download-metobs.smhi.se/api/version/1.0/parameter/{parameter}/station-set/all/period/latest-hour/data.json
  format: 'JSON: every station''s latest value for one parameter (1 air temperature, 7 precipitation), with latitude and longitude'
  note: Keyless; every request goes through the plugin's HTTP client (public host, GET, size and time caps).
source:
  publisher: Swedish Meteorological and Hydrological Institute (SMHI)
  product: SMHI Open Data Meteorological Observations
  url: https://opendata.smhi.se/apidocs/metobs/
url_verified_on: '2026-11-20'
vintage:
  current: live
  cadence: live
license:
  class: attribution
  redistribute_ok: true
  commercial_ok: true
  bulk_ok: true
  attribution_text: 'Data: SMHI, CC BY 4.0'
  note: 'SMHI''s open data are CC BY 4.0 (since 2021, SMHI''s open data terms); keyless (2026-11-20: 200).'
maintenance:
  owner: acropolisdocs
  reviewed_on: '2026-11-20'
  verify_by: '2027-02-20'
  check:
    kind: http_get
    url: https://opendata-download-metobs.smhi.se/api/version/1.0/parameter/1.json
    expect: 200
  changelog:
  - rev: 1
    date: '2026-11-20'
    note: 'Added (3.1.0, library P3): the endpoint answered 200 without a key from the person''s computer on 2026-11-20; SMHI''s open data are CC BY 4.0
      (since 2021, SMHI''s open data terms).'
