use_when:
- The client reports performance by Designated Market Area and holds a license for the boundary file.
- An internal market review where DMA is the agreed market definition.
avoid_when:
- The map goes to an external audience; the license does not allow redistribution of the boundaries.
- County or metro areas serve the reader as well; use the public Census geographies instead.
