use_when:
- A carrier-choice map of an Australian state or region.
avoid_when:
- 'A map of indoor coverage: the release has outdoor and external-antenna maps only.'
join:
  key: h3
  type: string
  note: Polygons per operator; the adapter turns them into H3 cells (resolution 9) for the region
crs: EPSG:4326
delivery:
  mode: fetch
  url_template: https://data.gov.au/data/dataset/4b472a18-d0fa-409c-994a-ab17162bcb90/resource/{resource}/download/coverage-map-{operator}-{tech}-{environment}-{year}.kml
  format: KML or zipped KML, polygons with LEGEND and THRESHOLD (dBm)
  note: 'Listed through the CKAN package_show API (read 2026-11-20): 2026 4G outdoor maps are 240 to 300 MB each.'
