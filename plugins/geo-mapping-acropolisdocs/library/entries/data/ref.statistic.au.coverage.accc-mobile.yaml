id: ref.statistic.au.coverage.accc-mobile
type: statistic
rev: 1
status: active
title: 'ACCC Mobile Infrastructure Report: coverage per operator (Australia)'
summary: Australia's mobile coverage maps per operator (Telstra, Optus, TPG), technology (3G, 4G, 5G) and environment (outdoor, external antenna), one KML
  or zip a year, from the ACCC data release; read for the region onto H3 by the accc-mobile-coverage adapter.
