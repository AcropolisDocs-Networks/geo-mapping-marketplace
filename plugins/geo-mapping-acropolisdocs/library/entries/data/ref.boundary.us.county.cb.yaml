use_when:
- Rolling a metric up by county on a state, regional, or national map.
- A choropleth that joins to a client table on the five-digit county code.
avoid_when:
- The map needs exact legal boundaries or site-level precision.
- Shoreline detail matters; generalized files are clipped to the coast.
- The map is of a single metro area; the 1:20,000,000 outlines look blocky when zoomed in.
