use_when:
- A European market map shaded by a Eurostat statistic joined on NUTS_ID (population, broadband take-up, GDP by region).
- Country or regional outlines for a non-commercial European overview map.
avoid_when:
- 'A commercial deliverable: GISCO grants use "on condition that the data will not be used for commercial purposes"; contact EuroGeographics for a licence.'
- 'Exact administrative boundaries: these are statistical regions at 1:20 million; use 01M for detail, or the national mapping agency.'
join:
  key: NUTS_ID
  type: string
  note: NUTS_ID such as DE3, FR101, UKI3; LEVL_CODE 0 to 3, CNTR_CODE the two-letter country (EL for Greece, UK for the United Kingdom), NAME_LATN the name.
crs: EPSG:4326
delivery:
  mode: fetch
  format: GeoJSON
  size_mb: 2.96
  features: 1798
  columns:
  - NUTS_ID
  - LEVL_CODE
  - CNTR_CODE
  - NAME_LATN
  - NUTS_NAME
  - MOUNT_TYPE
  - URBN_TYPE
  - COAST_TYPE
  url_template: https://gisco-services.ec.europa.eu/distribution/v2/nuts/geojson/NUTS_RG_20M_2024_4326_LEVL_{variant}.geojson
  note: 'The main URL is the all-levels 1:20 million file (1,798 regions: 39 at level 0, 115 at 1, 299 at 2, 1,345 at 3), verified with its hash.
    One level at a time: ref_fetch.py fetch ID --variant 2 (level 0 to 3). Other scales (01M, 03M, 10M, 60M) and projections (3035, 3857)
    follow the same file pattern and are downloaded by hand; earlier versions 2021, 2016, 2013 suit older statistics.'
