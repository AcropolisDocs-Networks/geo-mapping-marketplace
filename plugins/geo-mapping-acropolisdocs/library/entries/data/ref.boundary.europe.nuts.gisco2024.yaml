title: European NUTS regions 2024 (Eurostat GISCO)
summary: The NUTS 2024 statistical regions of Europe at levels 0 to 3 (countries to small regions) from Eurostat GISCO, as GeoJSON with no key;
  free for non-commercial use with the EuroGeographics notice.
