use_when:
- The locator inset of a state, metro or city map: the state outline and its neighbours with sounds, bays and islands that read at inset size.
- State outlines on a regional or one-state map where the 1:20,000,000 coast is visibly coarse.
avoid_when:
- A national choropleth: the 1:20,000,000 file draws the same picture with a seventh of the vertices.
- The map needs exact legal boundaries or shoreline detail at metro or city scale; use the 1:500,000 counties and TIGER water areas (ground detail).
