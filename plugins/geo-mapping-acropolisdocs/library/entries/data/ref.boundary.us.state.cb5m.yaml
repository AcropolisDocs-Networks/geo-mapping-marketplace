id: ref.boundary.us.state.cb5m
type: boundary
rev: 1
status: active
title: US states, moderately generalized (Census cartographic boundary, 1:5,000,000)
summary: State polygons at 1:5,000,000, with the District of Columbia and Puerto Rico, for the locator inset and state outlines on state and regional maps where the 1:20,000,000 coast is too coarse.
