use_when:
- A Canadian market map rolled up by county (CDUID), joined to census or client tables that use the 2021 geographic codes.
avoid_when:
- 'Nothing is verified from the build environment: download the file in a browser and supply it before drawing.'
- 'The map needs exact legal boundaries: the cartographic files are clipped to the coast and generalized; the digital boundary files hold the full extent.'
pairs_with:
- ref.boundary.world.state.ne10
join:
  key: CDUID
  type: string
  width: 4
  note: CDUID as text; keep leading zeros. PRUID is the two-digit province code (35 Ontario, 24 Quebec, 59 British Columbia, 48 Alberta).
crs: EPSG:3347
delivery:
  mode: user-supplied
  format: Shapefile (zip), Lambert conformal conic (EPSG:3347)
  note: Download lcd_000b21a_e.zip from the 2021 Census boundary files page (www12.statcan.gc.ca/census-recensement/2021/geo/sip-pis/boundary-limites/index2021-eng.cfm,
    'cartographic boundary file') in a browser and supply it. www12.statcan.gc.ca answered HTTP 403 to the build environment on 2026-11-04 for the boundary
    file index and the zips, so the files are not verified; the Statistics Canada Open Licence page was read.
source:
