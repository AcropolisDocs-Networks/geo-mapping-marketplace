id: ref.public-service.us-wa.gis.geo-wa
type: public-service
rev: 1
status: active
title: Washington State Geospatial Open Data Portal (geo.wa.gov)
summary: 'Washington''s geospatial open data portal (WA Geoservices, orgId jsIt88o09Q0r1j8h): ArcGIS Hub discovery and hosted feature services (counties,
  parcels, emergency response boundaries, basemap).'
tags:
  geography:
  - us-wa
  level:
  - county
  - place
  - line
  - site
  domain:
  - general
  - transport
  - program
