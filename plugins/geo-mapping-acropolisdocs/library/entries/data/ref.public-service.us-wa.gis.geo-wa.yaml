use_when:
- Washington counties, parcels and emergency boundaries for a Puget Sound or statewide market map.
- Discovering a state layer by name on the hub, then pulling it through the shipped profile with geo-service-explore and geo-service-query.
avoid_when:
- 'A layer''s licence has not been read: state portals mix public-domain, CC BY and agency-specific terms, so each item''s terms are recorded in the capture
  before external use.'
- 'The need is national: use the Census, TIGERweb or federal entries; state portals cover their state only.'
pairs_with:
- ref.boundary.us.county.cb500k
delivery:
  mode: service
  profile: wa-geoservices
  protocol: arcgis
  layer: (choose a service and layer with geo-service-explore)
  max_record_count: 2000
  columns:
  - per layer
  request: service_query.py fetch --profile wa-geoservices --layer (choose a service and layer with geo-service-explore) --protocol arcgis
  note: 'REST root https://services.arcgis.com/jsIt88o09Q0r1j8h/arcgis/rest/services (verified 2026-11-04). Discovery hub: https://geo.wa.gov. Layers are
    chosen per map; nothing is pulled until a layer is named.'
  hub: https://geo.wa.gov
source:
  publisher: Washington State Geospatial Open Data Portal
  product: State GIS portal (ArcGIS Hub and REST services)
  url: https://services.arcgis.com/jsIt88o09Q0r1j8h/arcgis/rest/services
url_verified_on: '2026-11-04'
vintage:
  current: live portal
  cadence: irregular
license:
  class: open
  redistribute_ok: true
  commercial_ok: true
  bulk_ok: true
  attribution_text: 'Source: Washington State Geospatial Open Data Portal.'
  note: 'Portal-level: most layers are open government data, but the licence is per layer and is read from the item before external use.'
