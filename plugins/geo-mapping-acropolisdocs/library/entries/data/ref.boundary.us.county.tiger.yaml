id: ref.boundary.us.county.tiger
type: boundary
rev: 1
status: active
title: US counties, full detail (Census TIGER/Line)
summary: Full-resolution county polygons from TIGER/Line, for large-scale maps and spatial joins that need exact outlines.
tags:
  geography:
  - us
  level:
  - county
  domain:
  - general
  - telecom
  use_for:
  - choropleth
  - market-rollup
  - join-key
  - context-basemap
  avoid_for:
  - parcel-level
  - site-precision
  scale:
  - metro
  - local
  - site
  detail:
  - detailed
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - annual
  tier:
  - T1
  - T2
  license_class:
  - public-domain
  quality:
  - authoritative
use_when:
- A map of one metro area or county where shoreline and boundary detail should be accurate.
- A spatial join of site points to counties, where outline accuracy decides the answer.
avoid_when:
- The map is state-wide or larger; the 84 MB file is slow and the detail is invisible. Use the 1:500,000 or bundled generalized counties.
- The map needs legal boundaries; TIGER/Line is a mapping product and is not a legal description.
pairs_with:
- ref.boundary.us.county.cb500k
join:
  key: GEOID
  type: string
  width: 5
  note: Keep leading zeros. Never cast to integer.
  pattern: ^\d{5}$
crs: EPSG:4269
delivery:
  mode: fetch
  format: Shapefile (zip)
  size_mb: 80.1
  note: Size from the publisher's Content-Length; feature count and hash not measured.
