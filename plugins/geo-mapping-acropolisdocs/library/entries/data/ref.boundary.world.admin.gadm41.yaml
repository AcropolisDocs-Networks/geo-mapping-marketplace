use_when:
- An internal international map that needs deeper administrative levels (districts, municipalities) than geoBoundaries or Natural Earth hold, from one consistent
  source.
- Checking a country's admin hierarchy before choosing an official national file.
avoid_when:
- 'The map goes to a client or is published: GADM''s licence (gadm.org/license.html, read 2026-11-04) forbids redistribution and commercial use without
  permission.'
- 'A United States, Canadian or Mexican map for a client: the national files are official and open.'
