join:
  key: GID_1
  type: string
  note: GADM ids GID_0 (ISO3), GID_1, GID_2 and so on; NAME_1, NAME_2; HASC_1 carries the HASC code (e.g. CA.ON).
crs: EPSG:4326
delivery:
  mode: user-supplied
  format: GeoPackage (world, 1.4 GB) or per-country GeoPackage/Shapefile from gadm.org
  note: Download https://geodata.ucdavis.edu/gadm/gadm4.1/gadm_410-gpkg.zip (HEAD 200, 1,466,771,821 bytes, verified 2026-11-04) or the per-country file
    from gadm.org/download_country.html, and supply the layer for the country.
