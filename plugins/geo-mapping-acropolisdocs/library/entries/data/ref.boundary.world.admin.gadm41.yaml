id: ref.boundary.world.admin.gadm41
type: boundary
rev: 1
status: active
title: GADM 4.1 (administrative areas worldwide, restricted licence)
summary: Detailed administrative boundaries for every country at all available levels (one 1.4 GB GeoPackage, or per-country downloads) from GADM; free
  for academic and non-commercial use, redistribution and commercial use need permission.
