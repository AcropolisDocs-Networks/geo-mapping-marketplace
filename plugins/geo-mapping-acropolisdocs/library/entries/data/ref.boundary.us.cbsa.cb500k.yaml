use_when:
- Rolling a metric up to metro areas, or showing which counties sit in a metro.
- A market view where telecom markets track metro areas more closely than counties.
avoid_when:
- The map must cover every county; areas outside any CBSA are not drawn.
- A single metro map that needs county detail; pair this with the county file and the county-to-CBSA crosswalk.
