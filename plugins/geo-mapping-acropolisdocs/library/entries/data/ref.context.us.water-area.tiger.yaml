id: ref.context.us.water-area.tiger
type: context
rev: 1
status: active
title: US area water by county (Census TIGER/Line)
summary: Lakes, reservoirs, wide rivers and other water polygons, one file per county, for water context on a metro or local map.
tags:
  geography:
  - us
  level:
  - water
  domain:
  - general
  use_for:
  - context-basemap
  avoid_for:
  - engineering-grade
  - site-precision
  - legal-boundary
  scale:
  - metro
  - local
  - site
  detail:
  - detailed
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - annual
  tier:
  - T1
  - T2
  license_class:
  - public-domain
  quality:
  - authoritative
use_when:
- Water bodies under a metro or local site map, fetched for the counties the map covers (variant = five-digit county FIPS).
- A clipped water layer for a small multiple of one county per page.
avoid_when:
- 'The map is statewide or national: fetch one county at a time only; Natural Earth lakes and rivers serve the larger scales.'
- 'The map needs flow, order or stream network: NHDPlus HR (ref.context.us.hydrography.nhdplus-hr) carries the network.'
pairs_with:
- ref.context.world.lakes.ne10
- ref.context.world.rivers.ne10
crs: EPSG:4269
delivery:
  mode: fetch
  format: Shapefile (zip)
  size_mb: 0.65
  features: 1253
  columns:
  - ANSICODE
  - HYDROID
  - FULLNAME
  - MTFCC
  - ALAND
  - AWATER
  - INTPTLAT
  - INTPTLON
  url_template: https://www2.census.gov/geo/tiger/TIGER2025/AREAWATER/tl_2025_{statefp}_areawater.zip
  note: The main URL is the Maricopa County, AZ file (04013), verified with its hash and count; every other county uses url_template with the five-digit
    county FIPS as the variant (ref_fetch.py fetch ID --variant 04019). Per-variant files carry no hash and their counts differ.
