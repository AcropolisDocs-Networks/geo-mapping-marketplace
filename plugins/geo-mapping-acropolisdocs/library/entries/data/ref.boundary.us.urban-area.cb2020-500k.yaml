use_when:
- Splitting sites, towers or availability rows into urban and rural before a rollup, using the 2020 urban area definitions.
- A quiet urban-footprint layer under a state or regional map.
avoid_when:
- 'The map needs city limits or names for labels: urban areas cross municipal boundaries; use places instead.'
- 'A later vintage is wanted: urban areas are defined once per decennial census, so 2020 is current until the 2030 definitions.'
pairs_with:
