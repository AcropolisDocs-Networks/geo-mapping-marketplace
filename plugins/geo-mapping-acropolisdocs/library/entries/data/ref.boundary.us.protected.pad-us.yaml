title: Protected Areas Database of the United States (PAD-US 4.1)
summary: Fee, easement, designation and proclamation boundaries of public and protected lands (federal, state, local, tribal, private conservation) from
  USGS; the download is a large geodatabase, so the person supplies a clipped copy.
