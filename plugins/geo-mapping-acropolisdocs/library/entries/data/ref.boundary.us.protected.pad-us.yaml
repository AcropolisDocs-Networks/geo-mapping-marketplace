use_when:
- Public and protected lands as context for tower siting and permitting (federal land managers, wilderness, parks) on a market map.
- Counting a client's sites by land manager agency (Mang_Name, Mang_Type).
avoid_when:
- 'Nothing is verified beyond the catalogue item: do not draw it until a download or service is recorded.'
- 'Legal ownership is implied: PAD-US is an inventory compiled from many sources.'
