id: ref.public-service.us-az.gis.azgeo
type: public-service
rev: 1
status: active
title: AZGeo Data Hub and ArcGIS Server (Arizona)
summary: 'Arizona''s state geospatial clearinghouse: an ArcGIS Hub for discovery (AGIC, orgId MrgGZS7oC7drh1E8) and a state ArcGIS Server with ADOT, state
  land, forestry, 911 and imagery folders.'
tags:
  geography:
  - us-az
  level:
  - county
  - place
  - line
  - site
  domain:
  - general
  - transport
  - program
  use_for:
  - context-basemap
  - join-key
  - site-map
  avoid_for:
  - engineering-grade
  - site-precision
  scale:
  - state
  - metro
  - local
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - irregular
  tier:
  - T1
  - T2
  license_class:
  - open
  quality:
  - authoritative
use_when:
- Arizona roads (ADOT functional class), state trust land, 911 boundaries and county layers for an Arizona market map.
- Discovering a state layer by name on the hub, then pulling it through the shipped profile with geo-service-explore and geo-service-query.
avoid_when:
- 'A layer''s licence has not been read: state portals mix public-domain, CC BY and agency-specific terms, so each item''s terms are recorded in the capture
  before external use.'
- 'The need is national: use the Census, TIGERweb or federal entries; state portals cover their state only.'
pairs_with:
- ref.boundary.us.county.cb500k
delivery:
  mode: service
  profile: azgeo
  protocol: arcgis
  layer: (choose a service and layer with geo-service-explore)
  max_record_count: 2000
  columns:
  - per layer
  request: service_query.py fetch --profile azgeo --layer (choose a service and layer with geo-service-explore) --protocol arcgis
  note: 'REST root https://azgeo.az.gov/arcgis/rest/services (verified 2026-11-04). Discovery hub: https://azgeo-data-hub-agic.hub.arcgis.com. Layers are
    chosen per map; nothing is pulled until a layer is named.'
  hub: https://azgeo-data-hub-agic.hub.arcgis.com
source:
  publisher: AZGeo Data Hub and ArcGIS Server
  product: State GIS portal (ArcGIS Hub and REST services)
  url: https://azgeo.az.gov/arcgis/rest/services
url_verified_on: '2026-11-04'
vintage:
  current: live portal
  cadence: irregular
license:
  class: open
  redistribute_ok: true
  commercial_ok: true
  bulk_ok: true
  attribution_text: 'Source: AZGeo Data Hub and ArcGIS Server.'
  note: 'Portal-level: most layers are open government data, but the licence is per layer and is read from the item before external use.'
