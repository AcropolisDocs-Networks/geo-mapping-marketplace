    date: '2026-11-02'
    note: 'Draft: the FCC site refused automated requests from the build environment (HTTP 403); the download location and layout are not verified.'
  - rev: 2
    date: '2026-11-04'
    note: 'Still draft: The FCC web hosts (fcc.gov, data.fcc.gov, broadbandmap.fcc.gov) refuse automated requests from the build environment (HTTP 403 on
      2026-11-04), so the r_tower.zip download could not be verified. The route and the table layout are recorded so the person can download it; delivery
      is user-supplied until a reachable copy exists.'
