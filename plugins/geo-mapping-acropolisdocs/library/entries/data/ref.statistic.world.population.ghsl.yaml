id: ref.statistic.world.population.ghsl
type: statistic
rev: 1
status: active
title: GHSL population grid 2020, 100 m (GHS-POP R2023A)
summary: 'Residents per 100 m cell for the whole world, epoch 2020, from the Global Human Settlement Layer (census counts disaggregated onto built-up area); one GeoTIFF per 10-degree tile, Mollweide (ESRI:54009). The denominator for people under a footprint anywhere.'
tags:
  geography: [world]
  level: [grid]
  domain: [demographics]
  use_for: [normalization, coverage-footprint, density-surface]
  avoid_for: [legal-boundary, parcel-level, site-precision]
  scale: [national, regional, state, metro, local]
  detail: [detailed]
  audience: [any]
  confidentiality: [public]
  freshness: [irregular]
  tier: [T1, T2]
  license_class: [attribution]
  quality: [derived]
use_when:
- People under a coverage footprint, a buffer or a market outside the United States are counted (raster_zonal sum), or a count is wanted finer than any boundary layer offers.
- Population must be comparable across countries on one map; the grid is built the same way everywhere.
avoid_when:
- The area is in the United States and ACS block groups or tracts are at hand; ref.statistic.us.acs5.population is the census authority and carries margins of error.
- A figure for a single building or block is wanted; a 100 m cell holds a model's share of a census unit, not a count of residents there.
- The year matters; the grid is the 2020 epoch of a 1975 to 2030 series, interpolated between censuses.
pairs_with: [ref.statistic.world.population.worldpop, ref.boundary.world.country.geoboundaries]
distinct_from: [ref.statistic.world.population.worldpop, ref.statistic.us.acs5.population]
join:
  key: none
  type: raster
  note: 'No join: the value is read under polygons with raster_io.zonal (sum, all_touched false) and the partial-pixel policy is written into the provenance.'
delivery:
  mode: fetch
  url_template: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2020_GLOBE_R2023A_54009_100/V1-0/tiles/GHS_POP_E2020_GLOBE_R2023A_54009_100_V1_0_R{row}_C{col}.zip
  tiling: '10-degree tiles in Mollweide, rows 1 to 18 from the north and columns 1 to 36 from the west; R6_C9 covers the south-western United States and northern Mexico (16.7 MB zipped). The whole world in one file is GHS_POP_E2020_GLOBE_R2023A_54009_100_V1_0.zip (5.1 GB) at the parent folder.'
  format: GeoTIFF float32 inside a zip, ESRI:54009 (World Mollweide), 100 m cells, nodata -200
  alt_template: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2020_GLOBE_R2023A_4326_3ss/V1-0/tiles/GHS_POP_E2020_GLOBE_R2023A_4326_3ss_V1_0_R{row}_C{col}.zip
  alt_note: 'The same epoch at 3 arc-seconds (about 90 m) in EPSG:4326, for a map that must stay in degrees; R6_C9 is 188 MB.'
  note: Not bundled. geo-find-data or terrain-analysis fetches the tile a window needs, records its sha256 and keeps it under .geo-mapping/fetch/.
