use_when:
- 'A Montréal métro or bus map: lines, stations and stops from the GTFS file (map-create reads GTFS directly).'
- Walk or transit isochrones from Montréal stations (isochrone-map with the GTFS feed).
avoid_when:
- 'Real-time vehicle positions: they need a developer portal account and key (portail.developpeurs.stm.info), whose delivery was not read.'
- 'Suburban trains and buses (exo, RTL, STL): other agencies'' feeds.'
delivery:
  mode: fetch
  format: GTFS (zip, about 66 MB)
  note: Static GTFS from the STM developers page (French; read 2026-11-07), no key. Real-time GTFS-RT (API i3) through the developer portal, limit 10 requests
    a second and 10,000 a day per account (from the spec's earlier read); the key header was not read.
