id: ref.boundary-derived.us.cbrs-pal.fcc
type: boundary-derived
rev: 2
status: active
title: FCC CBRS Priority Access Licenses (Auction 105) by county
summary: Winning bidders and PAL block counts per county from Auction 105 (3.5 GHz CBRS), as a table to join to county polygons for a licence-holding map.
tags:
  geography:
  - us
  level:
  - county
  domain:
  - telecom
  use_for:
  - choropleth
  - market-rollup
  - join-key
  avoid_for:
  - legal-boundary
  - site-precision
  - engineering-grade
  scale:
  - national
  - regional
  - state
  detail:
  - generalized
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - static
  tier:
  - T1
  - T2
  license_class:
  - public-domain
  quality:
  - authoritative
use_when:
- A map of CBRS PAL holdings by county for one bidder, or the number of PALs won per county.
- Checking where a client holds priority access before a CBRS deployment map.
avoid_when:
- 'The map should show CBRS coverage or GAA use: PALs are county-level licences, not coverage, and GAA use is not in the auction results.'
- 'Current holdings after secondary-market transfers matter: the auction results are the 2020 close, and ULS holds later assignments.'
pairs_with:
- ref.boundary.us.county.cb
join:
  key: county_fips
  type: string
  width: 5
  note: 'Derived at fetch from the licence id (PL-D01001-P1: county FIPS 01001, characters 5 to 9), since the file''s own county column is the auction''s
    code (AL-001). Up to 7 PAL blocks per county; join to ref.boundary.us.county.cb on GEOID.'
crs: EPSG:4269
delivery:
  mode: fetch
  format: zip
  features: 20625
  derive:
    county_fips:
      column: license
      start: 4
      end: 9
  columns:
  - license
  - county
  - county_name
  - bidder
  - frn
  - gross_license_price
  - net_license_price
  - bidding_credit_type
  - county_fips
  note: A zip holding results_by_license.csv (a table, no geometry). The Public Reporting System's file links answer with the page; the same address with
    /download sends the zip (verified 2026-11-15). 20,625 licences in 3,220 counties won by 228 bidders. all_county_status.zip (the round-by-round clock
    prices, with census_id) sits beside it.
source:
