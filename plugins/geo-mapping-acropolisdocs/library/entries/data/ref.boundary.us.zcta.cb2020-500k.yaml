use_when:
- A customer or sales table keyed on ZIP code needs shading by area.
- A choropleth where ZCTAs are the finest geography available to the audience.
avoid_when:
- The data is keyed on real USPS ZIP codes for delivery routes; ZCTAs are statistical areas and differ from ZIP codes.
- 'The map needs a current vintage: ZCTAs are redrawn only each decennial census, so this file reflects 2020.'
