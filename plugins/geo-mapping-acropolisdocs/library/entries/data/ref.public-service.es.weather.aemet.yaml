use_when:
- Station observations or climate values near Spanish sites, once the key delivery is confirmed.
avoid_when:
- How the key is sent is not stated on the information page (2026-11-07), so the plugin has no credential block for it yet.
- 'Two steps per request: AEMET answers with a link to the data, which is fetched in a second request.'
delivery:
  mode: user-supplied
  note: Request a key with an e-mail address (Obtención de API Key on opendata.aemet.es). The station inventory endpoint answered 200 with an empty body
    without a key on 2026-11-07.
source:
  publisher: Agencia Estatal de Meteorología (AEMET)
