  bulk_ok: false
  attribution_text: 'Fuente: AEMET.'
  note: 'Information page (read 2026-11-07): data in Annex II of AEMET''s public-price resolution (BOE, 5 January 2016) is free; use and reproduction are
    allowed "citando a Aemet como autora de la misma".'
