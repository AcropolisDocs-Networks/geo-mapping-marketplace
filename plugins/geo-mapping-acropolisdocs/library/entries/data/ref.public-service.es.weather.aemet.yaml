id: ref.public-service.es.weather.aemet
type: public-service
rev: 3
status: active
title: AEMET OpenData (Spain weather and climate)
summary: Spanish weather observations, forecasts and climate records from AEMET OpenData, with a free key; reuse requires citing AEMET.
tags:
  geography:
  - es
  level:
  - site
  domain:
  - weather
  use_for:
  - site-map
  - context-basemap
  avoid_for:
  - engineering-grade
  - site-precision
  scale:
  - national
  - regional
  - metro
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - live
  tier:
  - T2
  license_class:
  - attribution
  quality:
  - authoritative
use_when:
- Spanish station observations or the station inventory, with the person's own AEMET key (map-credentials add aemet).
avoid_when:
- 'Two steps per request: AEMET answers with a link to the data, which is fetched in a second request.'
delivery:
  sample:
    request: observations
  mode: service
  protocol: rest-json
  requires_credential:
    name: aemet
    kind: apikey
    class: secret
    host: opendata.aemet.es
    inject:
      query: api_key
    reject:
      status:
      - 401
    signup_url: https://opendata.aemet.es/centrodedescargas/altaUsuario
    free: true
    limits: No request limits are published; the key is free on request (sign-up page, 2026-11-15).
    note: The key is a token sent by e-mail after the sign-up form; it may also go in a header named api_key.
    probe: https://opendata.aemet.es/opendata/api/valores/climatologicos/inventarioestaciones/todasestaciones
  requests:
    observations: https://opendata.aemet.es/opendata/api/observacion/convencional/todas
    stations: https://opendata.aemet.es/opendata/api/valores/climatologicos/inventarioestaciones/todasestaciones
  read:
    follow: datos
    follow_hosts:
    - opendata.aemet.es
    suffix: -d.json
  note: 'Each call answers with a datos address on opendata.aemet.es; library_request follows it (without the key) and keeps the JSON file (text in ISO-8859-15).
    observations: the last hours of every conventional station (idema, lat, lon, ta, prec...); stations: the station inventory. A made-up key answered 401
    {"estado": 401} on 2026-11-22.'
source:
  publisher: Agencia Estatal de Meteorología (AEMET)
  product: AEMET OpenData
  url: https://opendata.aemet.es/centrodedescargas/info
url_verified_on: '2026-11-15'
vintage:
  current: live
  cadence: live
license:
  class: attribution
  redistribute_ok: true
  commercial_ok: true
  bulk_ok: false
  attribution_text: 'Fuente: AEMET.'
  note: 'Alta de usuario page (read 2026-11-15): use and reproduction allowed citing AEMET as the author; data under Annex II of the public-price resolution
    (BOE, 2016-01-05) is free. Ley 18/2015 on reuse applies.'
maintenance:
  owner: acropolisdocs
  reviewed_on: '2026-11-22'
  verify_by: '2027-02-15'
  changelog:
  - rev: 1
    date: '2026-11-07'
    note: 'Draft (reference library additions, P2): the information page read on 2026-11-07 (key by e-mail, citation condition); key delivery not stated.'
  - rev: 2
    date: '2026-11-15'
    note: 'Active (1.17.0): how the key is sent and refused read from the API itself (a wrong api_key answers 401 with estado 401); the reuse condition
      (cite AEMET) read on the sign-up page.'
  - rev: 3
    date: '2026-11-22'
    note: '3.6.0: fetched by the plugin: observations and the station inventory through library_request, following the datos address; check --probe asks
      for the inventory; 401 for a made-up key on 2026-11-22.'
