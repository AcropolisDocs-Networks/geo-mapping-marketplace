id: ref.public-service.us-ca.gis.geoportal
type: public-service
rev: 1
status: active
title: California State Geoportal (gis.data.ca.gov)
summary: 'California''s state geoportal (California Department of Technology, orgId uknczv4rpevve42E): ArcGIS Hub discovery and 167 hosted feature services
  (state boundary, counties, tracts, districts, broadband and evacuation layers).'
tags:
  geography:
  - us-ca
  level:
  - county
  - place
  - line
  - site
  domain:
  - general
  - transport
  - program
  use_for:
