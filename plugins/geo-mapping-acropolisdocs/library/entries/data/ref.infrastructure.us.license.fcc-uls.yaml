    date: '2026-11-02'
    note: 'Draft: the FCC site refused automated requests from the build environment (HTTP 403); nothing here is verified.'
  - rev: 2
    date: '2026-11-04'
    note: 'Still draft: The FCC web hosts (fcc.gov, data.fcc.gov, broadbandmap.fcc.gov) refuse automated requests from the build environment (HTTP 403 on
      2026-11-04). The per-service file names and the LO table layout are recorded so the person can download them; the cellular subset is served by ref.infrastructure.us.hifld.cell-tower.'
