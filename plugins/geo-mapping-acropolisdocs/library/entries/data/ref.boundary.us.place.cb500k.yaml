use_when:
- A metro or state map that shades or labels cities and towns, with the Census place GEOID as the join key.
- Rolling a site count or a client metric up to the city a site falls in.
avoid_when:
- The map needs the full-resolution city limits for a legal or parcel question; the TIGER/Line place file holds those.
- 'A national map: 32,629 polygons are heavy at that scale; label from the gazetteer instead.'
