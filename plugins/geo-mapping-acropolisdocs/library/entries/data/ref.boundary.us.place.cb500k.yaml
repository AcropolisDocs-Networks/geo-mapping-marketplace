- id: ref.boundary.us.aiannh.cb500k
  why: tribal areas, not municipalities
join:
  key: GEOID
  type: string
  width: 7
  note: State FIPS plus five-digit place FIPS as text; keep leading zeros. NAMELSAD carries the legal description (city, town, CDP).
  pattern: ^\d{7}$
