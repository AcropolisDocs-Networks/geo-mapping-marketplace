use_when:
- A context map of land mobile commercial transmission towers in a market, once the ULS l_LMcomm.zip tables are supplied (LO table for locations).
avoid_when:
- 'Nothing is verified from the build environment: the FCC download answered HTTP 403 and the HIFLD Open layer is withdrawn; supply the file before drawing
  it.'
- 'Positions must be exact: filed coordinates are as submitted.'
pairs_with:
- ref.infrastructure.us.license.fcc-uls
crs: EPSG:4326
delivery:
  mode: user-supplied
  format: zip of pipe-delimited ULS tables (LO carries locations)
  note: 'Download l_LMcomm.zip in a browser from data.fcc.gov/download/pub/uls/complete/ and supply it; see ref.infrastructure.us.license.fcc-uls for the
    table layout. The HIFLD Open feature service that carried this layer (services1.arcgis.com/Hp6G80Pky0om7QvQ) answers ''Invalid URL'' for it (2026-11-04):
    the layer was withdrawn from HIFLD Open. Third-party copies exist on ArcGIS Online (state agencies, universities) but none from the publisher, so nothing
    is recorded as a source.'
source:
  publisher: FCC (ULS); DHS HIFLD layer withdrawn
  product: Land Mobile Commercial Transmission Towers
vintage:
  current: weekly ULS complete file
  cadence: monthly
license:
  class: public-domain
  redistribute_ok: true
  commercial_ok: true
  bulk_ok: true
  attribution_text: 'Source: FCC Universal Licensing System.'
  note: Public domain; the download host refuses automated requests.
