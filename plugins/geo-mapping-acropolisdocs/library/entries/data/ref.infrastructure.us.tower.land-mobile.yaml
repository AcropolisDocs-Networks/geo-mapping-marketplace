status: active
title: Land mobile commercial transmission towers (FCC ULS)
summary: 'Licensed land mobile commercial locations from the FCC''s weekly ULS complete file (l_LMcomm.zip): one point per licensed location with its call
  sign, status, radio service and structure heights. The HIFLD Open copy was withdrawn.'
