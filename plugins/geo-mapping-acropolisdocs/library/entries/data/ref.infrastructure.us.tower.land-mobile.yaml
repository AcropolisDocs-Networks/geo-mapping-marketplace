type: infrastructure
rev: 1
status: draft
title: Land mobile commercial transmission towers (FCC ULS; HIFLD layer withdrawn)
summary: Licensed land mobile commercial transmission towers from FCC ULS, formerly served as a HIFLD Open layer; the publisher's copy is withdrawn and
  the FCC download refuses automated requests, so the person supplies the ULS file.
