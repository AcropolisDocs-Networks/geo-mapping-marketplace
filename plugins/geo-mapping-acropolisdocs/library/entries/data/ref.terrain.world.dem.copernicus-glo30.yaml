id: ref.terrain.world.dem.copernicus-glo30
type: terrain
rev: 1
status: active
title: Copernicus DEM GLO-30 Public (with GLO-90), world elevation, keyless from AWS Open Data
summary: 'The Copernicus 30 m digital surface model (buildings and trees included) for every land area, as 1-degree Cloud Optimized GeoTIFFs in the
  AWS Open Data bucket copernicus-dem-30m (eu-central-1), no account; GLO-90 where a 30 m tile is not public. The default relief outside the United
  States from 1.5.0.'
tags:
  geography: [world]
  level: [grid]
  domain: [general]
  use_for: [context-basemap, site-map]
  avoid_for: [engineering-grade, legal-boundary, parcel-level, site-precision]
  scale: [national, regional, state, metro, local]
  detail: [detailed]
  audience: [any]
  confidentiality: [public]
  freshness: [static]
  tier: [T1, T2]
  license_class: [attribution]
  quality: [authoritative]
use_when:
- Relief, hill glyphs or a 3D page outside the United States (terrain.source auto); 3DEP stays the US source.
- A map that cannot carry the Terrarium credit block; the Copernicus notice is one sentence.
avoid_when:
- 'A bare-earth profile, line of sight or viewshed: it is a surface model, so buildings and trees raise the ground; those analyses keep Terrarium or a DEM you supply.'
- A window wider than 16 one-degree tiles; Terrarium is used there.
pairs_with: [ref.terrain.us.dem.3dep, ref.context.world.ground.overture]
distinct_from:
- {id: ref.terrain.world.dem.terrarium, why: 'resampled SRTM-class bare-ish terrain in web tiles, any zoom, a long credit block'}
- {id: ref.terrain.us.dem.3dep, why: 'US only, bare earth, 10 m or finer'}
crs: EPSG:4326
delivery:
  mode: fetch
  url_template: https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_{northing}_{easting}_DEM/Copernicus_DSM_COG_10_{northing}_{easting}_DEM.tif
  fallback_url_template: https://copernicus-dem-90m.s3.amazonaws.com/Copernicus_DSM_COG_30_{northing}_{easting}_DEM/Copernicus_DSM_COG_30_{northing}_{easting}_DEM.tif
  format: Cloud Optimized GeoTIFF, float32, 1 x 1 degree (3600 px a side to 50 degrees latitude)
  cap: 16 tiles a map, each fetched whole through SafeHTTP and kept under .geo-mapping/terrain/copernicus-tiles/
  note: 'Tile naming from the bucket''s readme.html (read 2026-11-10): [resolution in arc seconds]_[northing]_[easting], e.g. Copernicus_DSM_COG_10_N37_00_E023_00_DEM;
    tileList.txt lists the 26,450 GLO-30 Public and 26,475 GLO-90 tiles; the sea has no tiles (height 0). A tile is about 13 MB.'
source:
  publisher: European Space Agency and the Copernicus Programme, hosted by Sinergise on the Registry of Open Data on AWS
  product: Copernicus DEM GLO-30 Public and GLO-90 (DGED, 2021 release), Cloud Optimized GeoTIFFs
  url: https://registry.opendata.aws/copernicus-dem/
  terms_url: https://dataspace.copernicus.eu/explore-data/data-collections/copernicus-contributing-missions/collections-description/COP-DEM
url_verified_on: '2026-11-10'
vintage:
  current: Copernicus DEM 2021 release
  cadence: static
license:
  class: attribution
  redistribute_ok: true
  commercial_ok: true
  bulk_ok: true
  attribution_text: 'Elevation: produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under
    COPERNICUS by the European Union and ESA; all rights reserved. Copernicus DEM accessed from https://registry.opendata.aws/copernicus-dem.'
  note: 'The COP-DEM licence page (read 2026-11-10) asks, where the data are adapted or modified (a hillshade is), for the notice "produced using Copernicus
    WorldDEM-30 ..." (WorldDEM-90 for GLO-90 tiles); the AWS registry''s citation form is "Copernicus Digital Elevation Model (DEM) was accessed on DATE
    from https://registry.opendata.aws/copernicus-dem". The record of each fetch prints both, with the date.'
maintenance:
  owner: acropolisdocs
  reviewed_on: '2026-11-10'
  verify_by: '2027-11-10'
  check:
    kind: http_get
    url: https://copernicus-dem-30m.s3.amazonaws.com/tileList.txt
    expect: 200
  changelog:
  - rev: 1
    date: '2026-11-10'
    note: 'Added (1.5.0, R3-DEM): the bucket readme, the tile list, the registry citation and the COP-DEM licence notice read 2026-11-10; one tile
      (N37 E023, 13 MB) answered HTTP 200.'
attribution:
  corner: 'Elevation: Copernicus DEM (© DLR, © Airbus, ESA)'
  required_on_map: true
  collapse: allowed
  note: The full notice is in the popover and on exports.
  terms_read: '2026-11-10'
