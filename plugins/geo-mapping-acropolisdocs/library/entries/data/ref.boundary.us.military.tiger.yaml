use_when:
- Showing bases near a market as context for coordination zones (CBRS DPAs, AWS-3 federal incumbents) or for sites on or near an installation.
- Counting a client's sites inside installation boundaries.
avoid_when:
- The map needs the official DoD boundary or a secure-area line; TIGER holds a cartographic outline with a name only.
- 'The map is about spectrum protection zones themselves: those come from the NTIA and FCC rules, not from this outline.'
distinct_from:
- id: ref.boundary.us.protected.pad-us
  why: PAD-US holds every public land manager; this file holds installations only
