id: ref.map-type.dot-density
type: map-type
rev: 3
status: active
title: Dot density
summary: Scatters dots in each area, one dot per fixed quantity, to show where a population or count concentrates (the dot_density op, drawn as a points
  layer).
tags:
  use_for:
  - dot-density
  avoid_for: []
use_when:
- The message is about where counts concentrate, not about a rate per area.
avoid_when:
- The reader needs exact values per area.
- The dots would be placed at random and the audience may read them as real locations.
pairs_with:
- ref.boundary.us.county.cb
- ref.boundary.us.state.cb20m
chooses_when:
  message_type:
  - distribution
  data_shape:
  - polygon-count
requires:
  data_shape: see chooses_when
  join_key: false
recommended:
  role: points
  ops:
  - op: dot_density
    value: <count column>
    per: <one dot = N>
  symbol:
    size: 2.4
    color: '@brand.emphasis'
  legend_note: One dot = N <units>, placed at random within each <area>
  outline: 'the same polygons as a role: context layer under the dots'
guarded_by:
- MAP-OPS-011
- MAP-OPS-008
license:
  class: open
  redistribute_ok: true
  commercial_ok: true
  bulk_ok: true
maintenance:
  owner: acropolisdocs
  reviewed_on: '2026-11-18'
  verify_by: '2027-11-15'
  check: the gallery map builds (tests/test_release_1170.py)
  changelog:
  - rev: 1
    date: '2026-11-02'
    note: 'Draft: the renderer does not build this map type yet; the entry records when to choose it so selection can say it is not available.'
  - rev: 2
    date: '2026-11-15'
    note: 'Active (1.17.0): the dot_density op (thematic.py) places one dot per `per` units at random inside each polygon (stochastic rounding, seeded)
      and the points layer draws them; MAP-OPS-011 says the dots are not locations. Gallery: dot-density.yaml.'
  - rev: 3
    date: '2026-11-18'
    note: 'The recipe writes symbol.color (1.19.0, Day 17 issue A5): with fill the dots fell back to the default colour. Points now read either.'
