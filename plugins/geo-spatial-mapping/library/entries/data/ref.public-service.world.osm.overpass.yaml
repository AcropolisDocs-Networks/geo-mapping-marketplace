id: ref.public-service.world.osm.overpass
type: public-service
rev: 3
status: active
title: Overpass API (OpenStreetMap queries)
summary: The public Overpass API answers Overpass QL queries over live OpenStreetMap data (towers, masts, buildings, roads in a bbox) under fair-use limits;
  results are GeoJSON-convertible JSON.
tags:
  geography:
  - world
  level:
  - site
  - line
  - place
  domain:
  - telecom
  - transport
  - general
  use_for:
  - site-map
  - context-basemap
  avoid_for:
  - engineering-grade
  - site-precision
  - legal-boundary
  scale:
  - metro
  - local
  - site
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - live
  tier:
  - T2
  license_class:
  - share-alike
  quality:
  - community
use_when:
- Mapped masts and towers (man_made=mast, man_made=tower, tower:type=communication) in a metro bbox as context when no licensed inventory exists.
- Buildings or points of interest around a venue for a small-area map.
avoid_when:
- 'A statewide or national pull: the public instance''s fair-use terms (about 10,000 queries or 1 GB a day per client, 180 s timeout, 512 MB memory per
  query, two concurrent requests) rule it out; use a Geofabrik extract.'
- 'Completeness is expected: OpenStreetMap carries what contributors mapped, which for towers is uneven.'
pairs_with:
- ref.infrastructure.world.osm.geofabrik
delivery:
  mode: service
  protocol: overpass
  tool: osm_fetch
  api:
    host: overpass-api.de
    requests:
    - method: POST
      path: /api/interpreter
      body: form
      idempotent: true
      changes: false
    limits:
      sequential: true
  mirrors:
  - host: overpass-api.de
    seen: answered from the person's computer (2026-11-21), often HTTP 502 "at capacity" on a first try
  - host: overpass.kumi.systems
    seen: blocked by the account's network allowlist (2026-11-21)
  - host: overpass.private.coffee
    seen: blocked by the account's network allowlist (2026-11-21)
  - host: maps.mail.ru
    seen: answered 504 (2026-11-21)
  note: '3.4.0: fetched by the map server''s osm_fetch tool and the MapSpec source `{type: osm, tags: [...]}` (scripts/osm.py): one POST at a time
    with the query in the form field `data`, `out geom`; 429, 502, 503 and 504 tried again after 2, 6 and 18 s, then the next mirror, stopping after
    the list. The cloud workspace reaches none of the mirrors: fetch on the person''s computer (the map server runs there). Caps: one query at a time,
    under 180 s, data under 512 MB, a few thousand requests a day; set an identifying User-Agent.'
source:
  url: https://overpass-api.de/api/status
  publisher: OpenStreetMap community (Overpass API, overpass-api.de)
  product: Overpass API public instance
url_verified_on: '2026-11-07'
vintage:
