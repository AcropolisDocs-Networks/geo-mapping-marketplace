id: ref.statistic.fr.coverage.arcep-mobile
type: statistic
rev: 1
status: active
title: 'Arcep Mon réseau mobile: theoretical coverage per operator (France)'
summary: France's theoretical mobile coverage, one GeoPackage (7z) per operator, technology (2G, 3G, 4G) and use (voice, data), polygons by level (very
  good, good, limited), quarterly; read for the region onto H3 by the arcep-mon-reseau-mobile adapter.
