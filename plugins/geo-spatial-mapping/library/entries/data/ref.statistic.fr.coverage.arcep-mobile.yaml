use_when:
- A carrier-choice map of a French region or department (operators with good 4G data coverage).
avoid_when:
- 'Measured quality: these are the operators'' predictions (Arcep''s measurements are a separate set).'
join:
  key: h3
  type: string
  note: Polygons per operator and level; the adapter turns them into H3 cells (resolution 9)
crs: EPSG:2154
delivery:
  mode: fetch
  url_template: https://arcep.s3.rbx.io.cloud.ovh.net/mobile/couvertures_theoriques/{quarter}/Metropole/00_Metropole/{quarter}_couv_Metropole_{operator}_{techno}_{usage}.gpkg.7z
  format: 7z holding one GeoPackage, Lambert-93 (the overseas territories in their UTM zones)
  note: Fields operateur, operateur_commercial, operateur_infra, date, techno, usage, niveau (TBC, BC, CL), dept; the documentation_couverture.md read 2026-11-20.
    Metropolitan 4G data files are 130 to 390 MB each (2026_T2).
source:
