use_when:
- A carrier-choice map of a German state or district (number of operators with 5G or 4G).
avoid_when:
- 'Per-operator coverage: the file gives counts, not names (the 1.3 GB GeoPackage has them).'
join:
  key: id
  type: string
  note: BKG 100 m grid cell, 100mN{northing/100}E{easting/100} (EPSG:25832); the adapter places each cell on H3 resolution 10 by its centre
crs: EPSG:25832
delivery:
  mode: fetch
  url_template: https://data.bundesnetzagentur.de/Bundesnetzagentur/GIGA/DE/MobilfunkMonitoring/{quarter}/{yyyymm}_MobilfunkMonitoring.zip
  format: zip with one CSV (id, gsm_out, lte, nr_sa, nr_gesamt), about 900 MB unzipped
  note: id is the BKG grid cell, 100mN{northing/100}E{easting/100} in ETRS89 / UTM 32N (EPSG:25832); the readme in the zip, read 2026-11-20. The file is
    found on the Gigabit-Grundbuch download page.
