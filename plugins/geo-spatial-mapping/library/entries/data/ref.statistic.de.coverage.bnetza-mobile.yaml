id: ref.statistic.de.coverage.bnetza-mobile
type: statistic
rev: 1
status: active
title: 'Bundesnetzagentur Mobilfunk-Monitoring: operators per 100 m cell (Germany)'
summary: Germany's mobile coverage as the number of operators (Telekom, Vodafone, Telefónica, 1&1) offering 2G, 4G, 5G and 5G SA in each 100 m grid cell,
  quarterly; read for the region onto H3 by the bnetza-mobile-coverage adapter.
