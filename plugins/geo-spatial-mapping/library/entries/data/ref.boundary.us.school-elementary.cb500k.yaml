id: ref.boundary.us.school-elementary.cb500k
type: boundary
rev: 1
status: active
title: US school districts, elementary, 1:500,000, by state (Census cartographic boundary)
summary: 'The elementary school districts of one state for the 2024 to 2025 school year: one file per state.'
tags:
  geography: [us]
  level: [school-district]
  domain: [general, demographics]
  use_for: [choropleth, join-key, context-basemap]
  avoid_for: [parcel-level, engineering-grade, legal-boundary, site-precision]
  scale: [state, metro, local]
  detail: [simplified]
  audience: [any]
  confidentiality: [public]
  freshness: [annual]
  tier: [T1, T2]
  license_class: [public-domain]
  quality: [authoritative]
use_when:
- 'A map by school district (E-Rate, student connectivity, a programme by district) in a state whose districts are elementary.'
- 'District lines as context where a town is known by its schools.'
avoid_when:
- 'A state has no districts of this kind: many states have unified districts only, and the file is then missing (the fetch says so). Arizona has all three.'
- 'All of a state is wanted in one layer: elementary and secondary districts overlap unified ones; take each kind the state uses.'
join:
  key: GEOID
  type: string
  note: 'State FIPS + local education agency code, 7 characters. Keep leading zeros.'
distinct_from:
- id: ref.boundary.us.school-unified.cb500k
  why: districts for every grade
- id: ref.boundary.us.school-secondary.cb500k
  why: districts for the upper grades only
crs: EPSG:4269
delivery:
  mode: fetch
  format: Shapefile (zip)
  geometry: polygon
  url_template: https://www2.census.gov/geo/tiger/GENZ2025/shp/cb_2025_{statefp}_elsd_500k.zip
  variant_key: statefp
  variant_required: true
  service_route: 'the same areas as a service: the shipped tigerweb profile, layer School/MapServer'
