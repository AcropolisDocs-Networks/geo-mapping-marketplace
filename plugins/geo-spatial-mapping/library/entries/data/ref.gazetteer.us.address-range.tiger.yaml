id: ref.gazetteer.us.address-range.tiger
type: gazetteer
rev: 1
status: active
title: US address ranges along streets, by county (TIGER/Line address features)
summary: 'Street segments of one county with the house-number range on each side and the ZIP code: what the Census geocoder interpolates along.'
tags:
  geography: [us]
  level: [line]
  domain: [general, geocoding]
  use_for: [label-reference, context-basemap]
  avoid_for: [parcel-level, engineering-grade, legal-boundary]
  scale: [local, site]
  detail: [detailed]
  audience: [any]
  confidentiality: [public]
  freshness: [annual]
  tier: [T1, T2]
  license_class: [public-domain]
  quality: [authoritative]
use_when:
- 'Site or venue addresses of one county are placed offline, by interpolating along a street segment.'
- 'Address ranges are drawn as block numbers on a local map.'
avoid_when:
- 'A handful of addresses: the Census geocoder (ref.public-service.us.geocoder.census) answers faster and reads this same data.'
- 'A point must be at the building: an interpolated range is a place along the street, not the door.'
pairs_with: [ref.public-service.us.geocoder.census]
crs: EPSG:4269
delivery:
  mode: fetch
  format: Shapefile (zip)
  geometry: line
  url_template: https://www2.census.gov/geo/tiger/TIGER2025/ADDRFEAT/tl_2025_{county}_addrfeat.zip
  variant_key: county
  variant_required: true
  note: 'The variant is the 5-digit county FIPS code. LFROMHN, LTOHN, RFROMHN and RTOHN are the range ends on the left and right; ZIPL and ZIPR the ZIP codes.'
