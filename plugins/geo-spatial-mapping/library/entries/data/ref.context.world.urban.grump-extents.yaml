use_when:
- 'A then-and-now story needs the urban footprint of the mid 1990s against a current built-up layer.'
avoid_when:
- 'Anything current: the extents are thirty years old (ESA WorldCover built-up is 2021 at 10 m).'
- 'A newer version is expected: NASA ended SEDAC''s contract on 30 April 2025. The data were restored in Earthdata Cloud on 17 June 2025 and are complete but frozen: no new versions.'
