use_when:
- 'Place and street names of Great Britain are looked up or labelled from the national source, with no key.'
- 'A list of British place names is turned into points.'
avoid_when:
- 'Only towns and cities are needed on a small-scale map: GeoNames or Natural Earth places are far smaller.'
- 'Northern Ireland: Great Britain only.'
crs: EPSG:27700
delivery:
  mode: user-supplied
  format: Zip of the national file (EPSG:27700)
  geometry: point
  size_mb: 209.5
  layer: named_place
  note: 'Too large for one fetch (the zip opens to 2.1 GB, over the 2 GB a fetch may unpack). Download the GeoPackage zip once from the address under source.url (the OS Downloads API, no key), keep the zip as it is, and read the map''s box from it: ref_fetch.py read ref.gazetteer.uk.place.os-open-names <the zip> --bbox W,S,E,N [--layer NAME]. Only the box is read.'
