  format: Zip of the national file (EPSG:27700)
  geometry: polygon
  size_mb: 807.7
  layer: district_borough_unitary
  layers: [district_borough_unitary, district_borough_unitary_ward, county, county_electoral_division, unitary_electoral_division, parish, community_ward, westminster_const, scotland_and_wales_const, scotland_and_wales_region, greater_london_const, english_region, country_region, polling_districts_england, boundary_line_ceremonial_counties, boundary_line_historic_counties, historic_european_region, high_water]
  note: 'Too large for one fetch (the library takes 400 MB a file). Download the GeoPackage zip once from the address under source.url (the OS Downloads API, no key), keep the zip as it is, and read the map''s box from it: ref_fetch.py read ref.boundary.uk.admin.os-boundary-line <the zip> --bbox W,S,E,N [--layer NAME]. Only the box is read.'
