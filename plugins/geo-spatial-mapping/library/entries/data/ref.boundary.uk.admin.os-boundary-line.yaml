id: ref.boundary.uk.admin.os-boundary-line
type: boundary
rev: 1
status: active
title: 'Boundary-Line: administrative and electoral boundaries of Great Britain (Ordnance Survey)'
summary: 'Every administrative and electoral boundary of Great Britain in one GeoPackage: counties, districts and unitary authorities, wards, parishes, Westminster and devolved constituencies, regions, and ceremonial and historic counties.'
tags:
  geography: [uk]
  level: [state, county, county-subdivision, admin1, admin2, admin3]
  domain: [general, demographics]
  use_for: [choropleth, join-key, context-basemap, market-rollup]
  avoid_for: [engineering-grade, legal-boundary, parcel-level]
  scale: [national, regional, metro, local]
  detail: [detailed]
  audience: [any]
  confidentiality: [public]
  freshness: [irregular]
  tier: [T1, T2]
  license_class: [attribution]
  quality: [authoritative]
use_when:
- 'A British map by ward, parish, constituency or county, at the detail councils and the Boundary Commissions use.'
- 'Election results or ward statistics are joined by their GSS code.'
avoid_when:
- 'Local authority districts alone are needed: ref.boundary.uk.lad.ons is one small file, fetched.'
- 'Northern Ireland: Great Britain only.'
join:
  key: Census_Code
  type: string
  note: 'The ONS GSS code of the area (E09000001); Name holds its name.'
crs: EPSG:27700
delivery:
