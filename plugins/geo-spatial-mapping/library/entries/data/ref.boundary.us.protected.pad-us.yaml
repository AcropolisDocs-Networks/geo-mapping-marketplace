id: ref.boundary.us.protected.pad-us
type: boundary
rev: 2
status: active
title: Protected Areas Database of the United States (PAD-US 4.1)
summary: Fee, easement, designation and proclamation boundaries of public and protected lands (federal, state, local, tribal, private conservation) from
  the USGS Gap Analysis Project's PAD-US 4.1 service, fetched by a box or a state.
tags:
  geography:
  - us
  level:
  - place
  domain:
  - general
  - program
  use_for:
  - context-basemap
  - coverage-footprint
  avoid_for:
  - engineering-grade
  - site-precision
  - legal-boundary
  - parcel-level
  scale:
  - national
  - regional
  - state
  - metro
  detail:
  - detailed
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - annual
  tier:
  - T2
  license_class:
  - public-domain
  quality:
  - authoritative
use_when:
- Public and protected lands as context for tower siting and permitting (federal land managers, wilderness, parks) on a market map.
- Counting a client's sites by land manager agency (Mang_Name, Mang_Type).
avoid_when:
- 'Legal ownership is implied: PAD-US is an inventory compiled from many sources.'
- 'A whole-nation layer: 655,335 polygons is past the fetch cap; take a market''s box or a state.'
distinct_from:
- id: ref.boundary.us.surface-management.blm
  why: BLM SMA is the federal surface ownership layer, served live
- id: ref.boundary.us.place.cb500k
  why: municipalities
- id: ref.boundary.us.urban-area.cb2020-500k
  why: urban footprints
- id: ref.boundary.us.aiannh.cb500k
  why: Census tribal areas
- id: ref.boundary.us.military.tiger
  why: military installations only
join:
  key: Unit_Nm
  type: string
  note: Unit name; Mang_Type and Mang_Name give the managing agency, Des_Tp the designation, GAP_Sts the protection status.
crs: EPSG:4326
delivery:
  mode: service
  profile: usgs-gap-padus
  protocol: arcgis
  layer: Manager_Type_PADUS/FeatureServer/0
  max_record_count: 1000
  geometry: polygon
  features: 655335
  columns:
  - FeatClass
  - Category
  - Own_Type
  - Own_Name
  - Mang_Type
  - Mang_Name
  - Des_Tp
  - Unit_Nm
  - State_Nm
  - GAP_Sts
  - Pub_Access
  - IUCN_Cat
  - GIS_Acres
  request: service_query.py fetch --profile usgs-gap-padus --protocol arcgis --layer Manager_Type_PADUS/FeatureServer/0 --bbox=W,S,E,N [--generalize-m 10]
  note: PAD-US 4.1 inventory on the USGS GAP ArcGIS Online organisation (655,335 polygons on 2026-11-15); query a market's box or a state (--where State_Nm).
    The national file is a 1.6 GB geodatabase on ScienceBase (item 652ef930d34edd15305a9b03) for a full-detail copy.
source:
  publisher: US Geological Survey, Gap Analysis Project
  product: Protected Areas Database of the United States (PAD-US) 4.1
  url: https://services.arcgis.com/v01gqwM5QqNysAAi/ArcGIS/rest/services/Manager_Type_PADUS/FeatureServer/0
url_verified_on: '2026-11-15'
vintage:
  current: 4.1 (2024)
  cadence: annual
license:
  class: public-domain
  redistribute_ok: true
  commercial_ok: true
  bulk_ok: true
  attribution_text: 'Source: U.S. Geological Survey Gap Analysis Project, PAD-US 4.1.'
  note: Public domain (USGS); the credit as given by USGS GAP.
maintenance:
  owner: acropolisdocs
  reviewed_on: '2026-11-15'
  verify_by: '2027-11-15'
  check:
    kind: http_get
    url: https://services.arcgis.com/v01gqwM5QqNysAAi/ArcGIS/rest/services/Manager_Type_PADUS/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json
    expect: 200
  changelog:
  - rev: 1
    date: '2026-11-04'
    note: 'Draft: the ScienceBase catalogue item answered (HTTP 200, 2026-11-04) but no download file or service was verified; the person downloads and
      clips.'
  - rev: 2
    date: '2026-11-15'
    note: 'Active (1.17.0) through the USGS GAP ArcGIS service (Manager_Type_PADUS, PAD-US 4.1, 655,335 polygons): a Phoenix-area box fetched 1,149 polygons
      in 2 pages with the full attribute set. The ScienceBase geodatabase (1.6 GB) is named for a full-detail copy.'
