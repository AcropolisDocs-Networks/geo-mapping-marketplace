    expect: 200
  changelog:
  - rev: 1
    date: '2026-11-04'
    note: 'Draft: the licences page answered (HTTP 200, 2026-11-04); the distribution addresses did not (404 and 403), so no file is recorded.'
  - rev: 2
    date: '2026-11-15'
    note: 'Active (1.17.0): data.geocode.earth answers for the US, Canada and Mexico databases (dated 2025-10-30); the Canada database read with the new
      wof-sqlite layout: 13 regions, 359 counties, localities by box. The licence corrected to what LICENSE.md says (a required link, the structure CC0,
