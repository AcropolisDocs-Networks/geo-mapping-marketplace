id: ref.gazetteer.world.place.wof
type: gazetteer
rev: 2
status: active
title: Who's On First gazetteer
summary: An open gazetteer of places with stable ids, hierarchies and concordances to other id systems (GeoNames, Wikidata, Quattroshapes), published as
  per-country SQLite databases and GeoJSON; CC BY 4.0 with per-source terms.
tags:
  geography:
  - world
  level:
  - place
  - country
  - state
  - county
  domain:
  - general
  use_for:
  - label-reference
  - join-key
  avoid_for:
  - engineering-grade
  - site-precision
  scale:
  - world
  - national
  - regional
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - irregular
  tier:
  - T2
  license_class:
  - attribution
  quality:
  - community
use_when:
- Crosswalking place ids between GeoNames, Wikidata and a client's naming, or drawing a country's regions, counties or localities with stable ids (ref_fetch.py
  read --placetype).
avoid_when:
- 'Official statistical boundaries are needed: the outlines come from many sources of varying date and detail; use the census agency''s files.'
- 'A source''s own terms matter for publication: some records carry stricter per-source licences (the licences page lists each).'
pairs_with:
- ref.gazetteer.world.place.geonames
- ref.public-service.world.wikidata
join:
  key: wof:id
  type: integer
  note: Who's On First id; wof:concordances carries gn:id (GeoNames) and wd:id (Wikidata).
delivery:
  mode: user-supplied
  layout: wof-sqlite
  format: bzip2-compressed SQLite database per country (spr and geojson tables)
  files:
    us: https://data.geocode.earth/wof/dist/sqlite/whosonfirst-data-admin-us-latest.db.bz2
    ca: https://data.geocode.earth/wof/dist/sqlite/whosonfirst-data-admin-ca-latest.db.bz2
    mx: https://data.geocode.earth/wof/dist/sqlite/whosonfirst-data-admin-mx-latest.db.bz2
  size_mb: US 886, MX 241, CA 184 (compressed, 2025-10-30)
  note: 'Download the country''s database from data.geocode.earth/wof/dist/sqlite/ (the address files above; whosonfirst-data-admin-<cc>-latest.db.bz2),
    decompress it (bunzip2, or 7-Zip on Windows) and read one placetype: ref_fetch.py read ref.gazetteer.world.place.wof FILE.db --placetype region [--bbox=W,S,E,N].
    Each record keeps its wof_id, name, placetype, parent_id and country.'
source:
  publisher: Who's On First (Geocode Earth)
  product: Who's On First administrative gazetteer
  url: https://data.geocode.earth/wof/dist/sqlite/whosonfirst-data-admin-us-latest.db.bz2
url_verified_on: '2026-11-15'
vintage:
  current: not verified
  cadence: irregular
license:
  class: attribution
  redistribute_ok: true
  commercial_ok: true
  bulk_ok: true
  attribution_text: 'Data from Who''s On First. License: https://whosonfirst.org/docs/licenses/'
  note: 'whosonfirst-data LICENSE.md (read 2026-11-15): crediting Who''s On First is recommended and a link to the licences page is required; the structure
    is CC0; records inherit their sources'' terms, listed on the licences page (mostly CC BY and open-government licences, CC0 for Mapzen and SimpleGeo;
    a few with no licence stated).'
maintenance:
