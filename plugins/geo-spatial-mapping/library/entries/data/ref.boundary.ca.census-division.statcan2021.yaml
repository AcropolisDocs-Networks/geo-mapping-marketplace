id: ref.boundary.ca.census-division.statcan2021
type: boundary
rev: 2
status: active
title: Canadian census divisions (StatCan 2021 cartographic boundary file)
summary: The 293 census divisions (counties, regional districts and equivalents) as 2021 cartographic polygons from Statistics Canada.
tags:
  geography:
  - ca
  level:
  - county
  domain:
  - general
  - demographics
  - telecom
  use_for:
  - choropleth
  - market-rollup
  - join-key
  - context-basemap
  avoid_for:
  - engineering-grade
  - site-precision
  - legal-boundary
  - parcel-level
  scale:
  - national
  - regional
  - state
  - metro
  detail:
  - simplified
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - static
  tier:
  - T2
  license_class:
  - attribution
  quality:
  - authoritative
use_when:
- A Canadian market map rolled up by county (CDUID), joined to census or client tables that use the 2021 geographic codes.
avoid_when:
- 'The map needs exact legal boundaries: the cartographic files are clipped to the coast and generalized; the digital boundary files hold the full extent.'
- 'Edges must match the published file exactly: the service sends the outlines generalized to 50 m to stay inside its time limit.'
pairs_with:
- ref.boundary.world.state.ne10
join:
  key: CDUID
  type: string
  width: 4
  note: CDUID as text; keep leading zeros. PRUID is the two-digit province code (35 Ontario, 24 Quebec, 59 British Columbia, 48 Alberta).
crs: EPSG:3347
delivery:
  mode: service
  profile: statcan-geo
  protocol: arcgis
  layer: 2021/Cartographic_boundary_files/MapServer/4
  max_record_count: 6000
  geometry: polygon
  features: 293
  columns:
  - CDUID
  - DGUID
  - CDNAME
  - CDTYPE
  - LANDAREA
  - PRUID
  request: service_query.py fetch --profile statcan-geo --protocol arcgis --layer 2021/Cartographic_boundary_files/MapServer/4 --page-size 50 --generalize-m
    50
  note: Statistics Canada's ArcGIS service of the 2021 cartographic boundary files (layer 4); 293 features in 6 page(s) of 50, generalized by the server
    to 50 m (full detail times out at its 60-second gateway). The file downloads on www12.statcan.gc.ca refuse automated requests (HTTP 403 from the build
    session and the owner's computer alike, 2026-11-15); a file downloaded in a browser is read the same way.
source:
  publisher: Statistics Canada
  product: 2021 Census Cartographic Boundary File, Canadian census divisions
  url: https://geo.statcan.gc.ca/geo_wa/rest/services/2021/Cartographic_boundary_files/MapServer/4
