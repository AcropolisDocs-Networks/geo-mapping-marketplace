  changelog:
  - rev: 1
    date: '2026-11-25'
    note: 'New (5.4.0, open data portals P4.3; the treatment of exception E2: a Source Cooperative product enters as a library entry read directly). Verified from the build workspace on 2026-11-25: the bucket listing answered 200 with 81 files; the Nairobi window (36.65,-1.45,37.05,-1.15) read 35,394 places (30.7 MB in 159 requests, 131 s the first time, while the 81 footers were kept); Lagos then read 14,734 places in 4.3 s from the kept index; London read 243,655 (128 MB, 125 s).'
