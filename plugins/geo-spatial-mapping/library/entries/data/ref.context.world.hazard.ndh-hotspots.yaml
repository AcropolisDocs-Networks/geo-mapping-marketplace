id: ref.context.world.hazard.ndh-hotspots
type: context
rev: 1
status: draft
title: 'Natural Disaster Hotspots: hazard frequency and distribution grids (CHRR and CIESIN, 2005; SEDAC, frozen)'
summary: 'World grids at 2.5 arc-minutes of how often each cell was hit by floods, cyclones, earthquakes, droughts, landslides and volcanoes over about two decades to 2000, in deciles, with a multi-hazard grid.'
