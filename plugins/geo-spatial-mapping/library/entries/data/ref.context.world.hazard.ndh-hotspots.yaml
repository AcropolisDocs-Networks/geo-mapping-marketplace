  concept_id: C3550186069-ESDIS
  format: GeoTIFF in a zip, EPSG:4326
  files: 'one zip a hazard: flood (CIESIN_CHRR_NDH_FLOOD_HFD), cyclone (..._CYCLONE_HFD), earthquake (..._EQUAKE_HFD), drought, landslide, volcano, and the multi-hazard grid'
  note: 'Fetched with the Earthdata tools and the person''s one token: earthdata_search (short_name=CIESIN_CHRR_NDH_MULTIHZ_HFD, kind=granules) lists the files, earthdata_fetch (urls=<one file>)
    shows the plan and downloads after the person agrees, into data/earthdata/CIESIN_CHRR_NDH_MULTIHZ_HFD/. The GeoTIFF inside the zip is then a file layer (role: raster) with
    this entry named in its provenance. Draft until one download has been made with a real token (see the changelog).'
