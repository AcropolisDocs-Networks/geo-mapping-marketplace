  audience: [any]
  confidentiality: [public]
  freshness: [static]
  tier: [T2]
  license_class: [attribution]
  quality: [derived]
use_when:
- 'A world or continental resilience story shows which regions face which natural hazards, at a glance and with the study named.'
avoid_when:
- 'A siting decision: the grids are coarse deciles from data that ends about 2000 (use FEMA flood zones, USGS earthquakes or a national hazard model).'
- 'A newer version is expected: NASA ended SEDAC''s contract on 30 April 2025. The data were restored in Earthdata Cloud on 17 June 2025 and are complete but frozen: no new versions.'
