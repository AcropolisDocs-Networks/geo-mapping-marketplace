id: ref.public-service.ca-on.transit.octranspo
type: public-service
rev: 3
status: active
title: OC Transpo (Ottawa) GTFS and GTFS-realtime
summary: Ottawa bus and O-Train schedules (GTFS, public since 2008) and GTFS-realtime for registered developers.
tags:
  geography:
  - ca-on
  level:
  - site
  - line
  domain:
  - transport
  use_for:
  - site-map
  - context-basemap
  - coverage-footprint
  avoid_for:
  - engineering-grade
  - site-precision
  scale:
  - regional
  - metro
  - local
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - irregular
  tier:
  - T2
  license_class:
  - restricted
  quality:
  - authoritative
use_when:
- Live Ottawa O-Train and bus positions or trip updates (GTFS-realtime) with the person's own OC Transpo subscription key (map-credentials add octranspo);
  the static GTFS file the person downloads for routes and stops.
avoid_when:
- 'The static GTFS address refuses automated requests (HTTP 403, 2026-11-15): download it in a browser and supply it.'
- 'Accuracy guarantees: OC Transpo states it cannot guarantee accuracy or completeness.'
- 'The feeds are labelled beta in their addresses (2026-11-22): check the developer portal if they move.'
delivery:
  sample:
    request: positions
  mode: service
  format: GTFS (zip); GTFS-realtime (protobuf)
  requires_credential:
    name: octranspo
    aliases:
    - oc-transpo
    kind: apikey
    class: secret
    host: nextrip-public-api.azure-api.net
    inject:
      header: Ocp-Apim-Subscription-Key
    reject:
      status:
      - 401
      - 403
    signup_url: https://nextrip-public-api.developer.azure-api.net/
    probe: https://nextrip-public-api.azure-api.net/octranspo/gtfs-rt-vp/beta/v1/VehiclePositions
    free: true
    limits: Not published on the developer pages (2026-11-22); the portal sets them per subscription.
  requests:
    positions: https://nextrip-public-api.azure-api.net/octranspo/gtfs-rt-vp/beta/v1/VehiclePositions
    trips: https://nextrip-public-api.azure-api.net/octranspo/gtfs-rt-tp/beta/v1/TripUpdates
  read:
    format: file
    suffix: .pb
  note: 'GTFS-realtime vehicle positions and trip updates through the NexTrip public API (Azure API Management): the key goes in the header Ocp-Apim-Subscription-Key,
    as the gateway names it in its 401 (2026-11-22; a made-up key answered 401 "invalid subscription key"). Static GTFS: https://www.octranspo.com/files/google_transit.zip
    refuses automated requests, so it is supplied as a file.'
source:
  publisher: City of Ottawa, OC Transpo
  product: GTFS and GTFS-realtime
  url: https://www.octranspo.com/en/plan-your-trip/travel-tools/developers
url_verified_on: '2026-11-22'
vintage:
  current: current GTFS
  cadence: irregular
license:
  class: restricted
  redistribute_ok: false
  commercial_ok: true
  bulk_ok: false
  attribution_text: 'Source: OC Transpo.'
  note: 'The developers page (read 2026-11-15) is the published terms: registered developers may use the GTFS-RT data for non-commercial and commercial
    purposes; OC Transpo does not guarantee accuracy. No separate terms page or attribution wording is published.'
maintenance:
  owner: acropolisdocs
  reviewed_on: '2026-11-22'
  verify_by: '2027-02-22'
  changelog:
  - rev: 1
    date: '2026-11-07'
    note: 'Draft (reference library additions, P2): the developers page read on 2026-11-07 (commercial use allowed for registered developers); feed addresses
      and key delivery not stated.'
  - rev: 2
    date: '2026-11-15'
    note: 'Active (1.17.0): the developers page re-read (commercial use for registered developers, no other terms published); the static feed address found
      on open.ottawa.ca, a browser download.'
  - rev: 3
    date: '2026-11-22'
    note: 'Fetched by the plugin (3.5.0): GTFS-realtime positions and trip updates with cred:octranspo (header Ocp-Apim-Subscription-Key, named by the gateway);
      401 without a key and with a made-up key on 2026-11-22.'
