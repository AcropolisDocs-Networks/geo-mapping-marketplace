id: ref.gazetteer.uk.postcode.os-code-point-open
type: gazetteer
rev: 1
status: active
title: 'Code-Point Open: postcode unit points of Great Britain'
summary: 'One point for each of the 1.7 million postcode units of Great Britain (the mean position of its addresses), with the codes of the areas it falls in.'
tags:
  geography: [uk]
  level: [place]
  domain: [general, geocoding]
  use_for: [join-key, label-reference, dot-density]
  avoid_for: [engineering-grade, legal-boundary, parcel-level, site-precision]
  scale: [national, regional, metro, local]
  detail: [detailed]
  audience: [any]
  confidentiality: [public]
  freshness: [irregular]
  tier: [T1, T2]
  license_class: [attribution]
  quality: [authoritative]
use_when:
- 'A table of British sites, shops or venues carries postcodes and needs points, offline and with no key.'
- 'Values reported by postcode are placed or rolled up to districts.'
avoid_when:
- 'A point at the door is needed; a postcode unit is about fifteen addresses.'
- 'The postcodes belong to private individuals: their addresses are not mapped (the plugin geocodes sites and venues only).'
- 'Northern Ireland (BT postcodes) is wanted; it is not in this product.'
join:
  key: postcode
  type: string
  note: 'The postcode unit, written as in the file (seven characters, the inward code right-aligned): compare after removing spaces.'
