id: ref.gazetteer.world.place.overture
type: gazetteer
rev: 3
status: active
title: Overture Maps places (points of interest)
summary: Worldwide points of interest with names, categories, brands, addresses and confidence scores from the Overture Maps Foundation places theme
  (GeoParquet on S3). The map's window is read by range request; a country the size of Kenya is about 100,000 places and 70 MB.
tags:
  geography:
  - world
  level:
  - site
  - place
  domain:
  - general
  use_for:
  - site-map
  - label-reference
  - context-basemap
  avoid_for:
  - engineering-grade
  - site-precision
  - legal-boundary
  scale:
  - national
  - regional
  - metro
  - local
  - site
  detail:
  - detailed
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - monthly
  tier:
  - T2
  license_class:
  - attribution
  quality:
  - community
use_when:
- 'Venues, stadiums, hospitals or retail around a program site, or every place of one kind in a country: filter on category (source.where: category = ''hospital'') and on country.'
- A labelled point layer of named places for a local map outside the Natural Earth and GeoNames sets.
avoid_when:
- 'Completeness or exact positions are expected: places carry a confidence score and come from merged open and licensed sources.'
- 'The window is a continent: the theme is 12 GB; a window of at most 12 degrees is read, and a read over the entry''s cap stops and keeps nothing.'
pairs_with:
- ref.gazetteer.world.place.geonames
join:
  key: id
  type: string
  note: Overture GERS id (stable across releases); names.primary, categories.primary, addresses, confidence, bbox struct for filtering.
crs: EPSG:4326
delivery:
  mode: fetch
  format: GeoParquet (S3), read for the map's window by HTTPS range request
  geometry: point
  window:
    reader: overture
    theme: places
    type: place
    release: 2026-11-18.0
    cap_mb: 400
    max_span_deg: 12
  columns: [id, name, category, confidence, operating_status, brand, address, locality, region, country, postcode, website]
  note: 'In a MapSpec: source: {type: ref, id: ref.gazetteer.world.place.overture, where: "country = ''KE'' AND category = ''hospital''"}; the build reads the
    window (window_read.py). By hand: window_read.py read ref.gazetteer.world.place.overture --bbox=W,S,E,N [--where ...] [--out F.parquet]. A place''s
    e-mail addresses, telephone numbers and social accounts are not read. confidence runs from 0 to 1: under about 0.5 a place may not exist.'
source:
  publisher: Overture Maps Foundation
  product: Overture places theme, release 2026-11-18.0
  url: https://overturemaps-us-west-2.s3.amazonaws.com/?list-type=2&prefix=release/2026-11-18.0/&delimiter=/
url_verified_on: '2026-11-25'
vintage:
