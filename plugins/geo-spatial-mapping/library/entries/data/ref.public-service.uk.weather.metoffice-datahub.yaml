id: ref.public-service.uk.weather.metoffice-datahub
type: public-service
rev: 3
status: active
title: Met Office Weather DataHub
summary: UK and global site-specific forecasts, observations and map images from the Met Office Weather DataHub, by product subscription with daily call
  limits.
tags:
  geography:
  - uk
  - world
  level:
  - site
  - grid
  domain:
  - weather
  use_for:
  - site-map
  - context-basemap
  avoid_for:
  - engineering-grade
  - site-precision
  scale:
  - national
  - regional
  - metro
  - local
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - live
  tier:
  - T2
  license_class:
  - restricted
  quality:
  - authoritative
use_when:
- UK site forecasts on a UK site or venue map, with the person's own Weather DataHub key for the free site-specific plan (map-credentials add metoffice-datahub).
avoid_when:
- 'More than 360 calls a day on the free site-specific plan: the limit resets at 00:00 UTC.'
- 'Official UK warnings: those come from the Met Office warnings service, not this entry.'
delivery:
  sample:
    request: hourly
    params:
      lat: '51.5'
      lon: '-0.12'
  mode: service
  protocol: rest-json
  requires_credential:
    name: metoffice-datahub
    aliases:
    - metoffice
    - met-office
    kind: apikey
    class: secret
    host: data.hub.api.metoffice.gov.uk
    inject:
      header: apikey
    reject:
      status:
      - 401
      - 403
    signup_url: https://datahub.metoffice.gov.uk/
    probe: https://data.hub.api.metoffice.gov.uk/sitespecific/v0/point/hourly?latitude=51.5&longitude=-0.12
    free: true
    limits: 'Free site-specific plan: 360 calls a day, reset at 00:00 UTC (pricing page, read 2026-11-15).'
  requests:
    hourly: https://data.hub.api.metoffice.gov.uk/sitespecific/v0/point/hourly?latitude={lat}&longitude={lon}
    three-hourly: https://data.hub.api.metoffice.gov.uk/sitespecific/v0/point/three-hourly?latitude={lat}&longitude={lon}
    daily: https://data.hub.api.metoffice.gov.uk/sitespecific/v0/point/daily?latitude={lat}&longitude={lon}
  note: 'Global Spot site-specific forecasts as GeoJSON (one point, its time series in the properties). The key goes in a header named apikey; without one
    the gateway answered 401 "Missing Credentials" and named that header, and a made-up key 401, on 2026-11-22.'
source:
  publisher: Met Office
  product: Weather DataHub
  url: https://datahub.metoffice.gov.uk/
url_verified_on: '2026-11-22'
vintage:
  current: live
  cadence: live
license:
  class: restricted
  redistribute_ok: false
  commercial_ok: true
  bulk_ok: false
  attribution_text: Contains Met Office data.
  note: 'The Weather DataHub terms open only after signing in (2026-11-15), so they are accepted at sign-up; the pricing page (read 2026-11-15) lists a
    free site-specific plan of 360 calls a day (limits reset at 00:00 UTC). Treated as restricted: no redistribution of the raw data.'
maintenance:
  owner: acropolisdocs
  reviewed_on: '2026-11-22'
  verify_by: '2027-02-22'
  changelog:
  - rev: 1
    date: '2026-11-07'
    note: 'Draft (reference library additions, P2): the DataHub overview read (products, daily limits at 00:00 UTC); pricing, key delivery and terms not
      readable as text on 2026-11-07.'
  - rev: 2
    date: '2026-11-15'
    note: 'Active (1.17.0): the free site-specific plan (360 calls a day) read on the pricing page; the terms open only after sign-in and are accepted there.'
  - rev: 3
    date: '2026-11-22'
    note: 'Fetched by the plugin (3.5.0): the site-specific hourly, three-hourly and daily point forecasts through library_request with cred:metoffice-datahub
      (header apikey); 401 without a key and with a made-up key on 2026-11-22.'
