status: draft
title: 'Gridded Population of the World v4.11: population density, 2000 to 2020 (SEDAC, frozen)'
summary: 'People a square kilometre for 2000, 2005, 2010, 2015 and 2020, the GPWv4 count divided by land area: GeoTIFF grids from 30 arc-seconds to 1 degree.'
