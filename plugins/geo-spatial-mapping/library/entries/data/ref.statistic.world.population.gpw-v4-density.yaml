use_when:
- 'A world or continental density surface is drawn straight from the grid (the 2.5 arc-minute file is 22 MB).'
avoid_when:
- 'A local map, for the reason given for the count: density is even across each census unit.'
- 'A newer version is expected: NASA ended SEDAC''s contract on 30 April 2025. The data were restored in Earthdata Cloud on 17 June 2025 and are complete but frozen: no new versions.'
join:
