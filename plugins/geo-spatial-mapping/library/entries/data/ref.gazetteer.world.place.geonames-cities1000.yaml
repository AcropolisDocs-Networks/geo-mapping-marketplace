    lon: longitude
    lat: latitude
  rolling: true
  features: 172046
  features_tolerance_pct: 5
  note: 'ref_fetch.py fetch ref.gazetteer.world.place.geonames-cities1000 downloads https://download.geonames.org/export/dump/cities1000.zip (11.1 MB),
    reads the header-less tab file by the 19 declared columns and caches the places as points. Rolling: the copy verified on 2026-11-20 had 172,046 places;
    a later copy that differs is used and reported, the count held within 5 percent. The build reads it only for the names a message makes.'
