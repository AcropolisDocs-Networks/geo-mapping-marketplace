    date: '2026-11-21'
    note: 'Active: used live for the Day 21 Antakya video from both machines (ohsome 1.10.4): contributions/geometry, elementsFullHistory/geometry,
      users/count and elements/count answered; elements/geometry and elements/centroid answered 403.'
