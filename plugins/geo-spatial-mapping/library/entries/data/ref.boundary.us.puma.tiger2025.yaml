title: US Public Use Microdata Areas (2020 PUMAs), by state (TIGER/Line)
summary: 'The 2020 Public Use Microdata Areas of one state: areas of at least 100,000 people that ACS microdata and the ACS 1-year tables are published for.'
tags:
  geography: [us]
  level: [puma]
  domain: [general, demographics]
