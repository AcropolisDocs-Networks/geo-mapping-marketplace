use_when:
- 'A rate comes from ACS microdata (PUMS) or a 1-year table published by PUMA.'
- 'A metro is split into areas of like population, which tracts and ZIP areas are not.'
avoid_when:
- 'The value is published by tract or county; PUMAs then only blur it.'
- 'A printed national map; the lines are full TIGER detail and there is no national file.'
