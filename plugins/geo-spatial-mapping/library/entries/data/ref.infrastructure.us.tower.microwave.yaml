id: ref.infrastructure.us.tower.microwave
type: infrastructure
rev: 2
status: active
title: Microwave service towers (FCC ULS microwave licences)
summary: 'Licensed microwave locations from the FCC''s weekly ULS complete file (l_micro.zip): one point per licensed location with its call sign, status,
  radio service and structure heights. The HIFLD Open copy was withdrawn.'
