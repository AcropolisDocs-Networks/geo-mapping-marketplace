use_when:
- A context map of microwave transmitter locations in a market, from the FCC's own weekly file (fcc_uls.py).
avoid_when:
- 'Positions must be exact: filed coordinates are as submitted.'
- 'The question is which carrier uses a site: ULS names the licensee of each licence, not every tenant of a structure.'
pairs_with:
- ref.infrastructure.us.license.fcc-uls
crs: EPSG:4269
delivery:
  mode: user-supplied
  format: zip of pipe-delimited ULS tables (LO locations, HD licence header)
  size_mb: 200 MB
  note: 'fcc_uls.py fetch l_micro downloads the weekly file through the guarded client; fcc_uls.py locations l_micro.zip OUT.gpkg [--state AZ] [--active]
    makes the points (NAD83). A zip downloaded in a browser is read the same way. Table layout: ref.infrastructure.us.license.fcc-uls.'
source:
  publisher: FCC Universal Licensing System
  product: Microwave Service Towers
  url: https://data.fcc.gov/download/pub/uls/complete/l_micro.zip
vintage:
  current: weekly ULS complete file
  cadence: monthly
license:
  class: public-domain
  redistribute_ok: true
  commercial_ok: true
  bulk_ok: true
  attribution_text: 'Source: FCC Universal Licensing System.'
  note: 'Public domain (US Government work); the credit is ''Source: FCC Universal Licensing System''.'
maintenance:
  owner: acropolisdocs
  reviewed_on: '2026-11-15'
  verify_by: '2027-05-15'
  changelog:
  - rev: 1
    date: '2026-11-04'
    note: 'Draft: The FCC web hosts (fcc.gov, data.fcc.gov, broadbandmap.fcc.gov) refuse automated requests from the build environment (HTTP 403 on 2026-11-04),
      and The HIFLD Open feature service that carried this layer (services1.arcgis.com/Hp6G80Pky0om7QvQ) answers ''Invalid URL'' for it (2026-11-04): the
      layer was withdrawn from HIFLD Open. Third-party copies exist on ArcGIS Online (state agencies, universities) but none from the publisher, so nothing
      is recorded as a source.'
  - rev: 2
    date: '2026-11-15'
    note: 'Active (1.17.0): data.fcc.gov answers (l_micro.zip, 200 MB); its LO and HD tables, 38 MB read by byte ranges and through fcc_uls.locations: 5,601
      active microwave locations in Arizona (CF 1,924, MG 1,853, MW 1,228, PF 201). The HIFLD route is dropped.'
  check:
