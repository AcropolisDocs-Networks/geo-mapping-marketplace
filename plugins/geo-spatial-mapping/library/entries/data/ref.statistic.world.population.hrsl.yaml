id: ref.statistic.world.population.hrsl
type: statistic
rev: 1
status: active
title: Meta High Resolution Settlement Layer (HRSL), about 30 m
summary: 'Meta''s (Data for Good) High Resolution Settlement Layer: people a 1-arc-second cell (about 30 m) on buildings seen in satellite imagery, read
  for the map''s window from the public VRT of Cloud-Optimized GeoTIFFs.'
tags:
  geography:
  - world
  level:
  - grid
  domain:
  - demographics
  use_for:
  - density-surface
  - normalization
  - dot-density
  avoid_for:
  - engineering-grade
  - site-precision
  scale:
  - metro
  - local
  - site
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - static
  tier:
  - T1
  - T2
  license_class:
  - attribution
  quality:
  - derived
use_when:
- People near a site or along a corridor where GHSL's 100 m cells are too coarse (population covered by a small cell's footprint).
avoid_when:
- 'A country or a state: at most about 1.1 degrees a side are read for one map; GHSL covers a region.'
- 'Countries HRSL does not cover: the VRT has no data there.'
crs: EPSG:4326
delivery:
  mode: fetch
  url_template: https://dataforgood-fb-data.s3.amazonaws.com/hrsl-cogs/hrsl_general/hrsl_general-latest.vrt
  format: GDAL VRT of COGs, Float64 people a cell, EPSG:4326 (1,295,354 x 458,338 cells)
  note: raster_fetch.py reads the window by GDAL range reads and keeps it as a GeoTIFF; the VRT answered 200 on 2026-11-20.
source:
  publisher: Meta (Data for Good) and CIESIN, Columbia University
  product: High Resolution Settlement Layer (HRSL)
  url: https://dataforgood.facebook.com/dfg/tools/high-resolution-population-density-maps
