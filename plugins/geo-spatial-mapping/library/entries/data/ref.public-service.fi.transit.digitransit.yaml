id: ref.public-service.fi.transit.digitransit
type: public-service
rev: 3
status: active
title: Digitransit (Finland) routing and transit APIs
summary: Finnish public transport routing (OpenTripPlanner), stops and real-time data for HSL (Helsinki), Waltti cities and all of Finland from Digitransit,
  with a subscription key.
tags:
  geography:
  - fi
  level:
  - site
  - line
  domain:
  - transport
  - routing
  use_for:
  - site-map
  - context-basemap
  - coverage-footprint
  avoid_for:
  - engineering-grade
  - site-precision
  scale:
  - national
  - regional
  - metro
  - local
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - live
  tier:
  - T2
  license_class:
  - attribution
  quality:
  - authoritative
use_when:
- Stops, routes or transit travel times in Helsinki or another Finnish city, with the person's own subscription key (map-credentials add digitransit).
avoid_when:
- Cost and licence are not confirmed (the terms of use were not read, 2026-11-07).
- 'Large batches: the provider asks for 0.5 to 1 second between requests and suggests hosting the API locally for heavy use.'
delivery:
  sample:
    request: stops
    bbox: 24.93,60.16,24.95,60.175
  mode: service
  protocol: graphql
  request: https://api.digitransit.fi/routing/v2/finland/gtfs/v1
  requests:
    stops: https://api.digitransit.fi/routing/v2/finland/gtfs/v1
    stops-hsl: https://api.digitransit.fi/routing/v2/hsl/gtfs/v1
  api:
    host: api.digitransit.fi
    requests:
    - method: POST
      path: /routing/v2/{router}/gtfs/v1
      body: json
      changes: false
      note: GraphQL queries only
  read:
    query: '{ stopsByBbox(minLat: {south}, minLon: {west}, maxLat: {north}, maxLon: {east}) { gtfsId name lat lon vehicleMode } }'
    records: data.stopsByBbox
  requires_credential:
    name: digitransit
    kind: apikey
    class: secret
    host: api.digitransit.fi
    inject:
      header: digitransit-subscription-key
    reject:
      status:
      - 401
      - 403
    signup_url: https://portal-api.digitransit.fi/
    free: true
    limits: Rate and quota limits enforced since 31.1.2024, meant to stop misuse; no more than 10 requests a second (registration page, read 2026-11-07)
    note: Subscribe to a product in the portal; the key is under Profile. The same name also works as a URL parameter
  note: 'Registration page (read 2026-11-07): key as header or URL parameter named digitransit-subscription-key; production hosts api.digitransit.fi and
    cdn.digitransit.fi. Routing paths (routing/v2/<router>/gtfs/v1, GraphQL) were not confirmed; a guessed path answered 404.'
source:
  publisher: Digitransit (HSL, Fintraffic, Waltti)
  product: Digitransit APIs
  url: https://digitransit.fi/en/developers/api-registration/
url_verified_on: '2026-11-15'
vintage:
  current: live
  cadence: live
license:
  class: attribution
  redistribute_ok: true
  commercial_ok: true
  bulk_ok: false
  attribution_text: © Digitransit (with the date and time the data was received)
  note: 'Terms of use (digitransit.fi developers/apis/7-terms-of-use, read 2026-11-15): CC BY 4.0, data owned by HSL, Fintraffic and Waltti Solutions; credit
    Digitransit with the date and time; OpenStreetMap-derived geography is ODbL; no fees; rate limits may be applied.'
maintenance:
  owner: acropolisdocs
  reviewed_on: '2026-11-15'
  verify_by: '2027-02-15'
  changelog:
  - rev: 1
    date: '2026-11-07'
    note: 'Draft (reference library additions, P2): the registration and API pages read on 2026-11-07 (key name, hosts, limits); cost, licence and the routing
      path not confirmed.'
  - rev: 2
    date: '2026-11-15'
    note: 'Active (1.17.0): the terms of use read: CC BY 4.0 (HSL, Fintraffic, Waltti), credit with date and time, no fees, ODbL for OSM-derived geography.'
  - rev: 3
    date: '2026-11-21'
    note: '3.2.0: the GraphQL routing endpoints /routing/v2/finland/gtfs/v1 and /routing/v2/hsl/gtfs/v1 answered 401 "missing subscription key" to a POST without a key on 2026-11-21 (so the path is right); stops by box through library_request.'
