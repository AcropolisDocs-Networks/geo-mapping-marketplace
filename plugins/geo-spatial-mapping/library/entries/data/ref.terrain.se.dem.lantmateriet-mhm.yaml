id: ref.terrain.se.dem.lantmateriet-mhm
type: terrain
rev: 1
status: active
title: Lantmäteriet Markhöjdmodell, 1 m (Sweden, bare earth)
summary: Sweden's 1 m bare-earth model as Cloud-Optimized GeoTIFF tiles found through Lantmäteriet's keyless STAC search and read by range with the person's
  free Geotorget login; terrain.source auto uses it in Sweden when the login is registered.
tags:
  geography:
  - se
  level:
  - grid
  domain:
  - general
  use_for:
  - context-basemap
  - site-map
  avoid_for:
  - engineering-grade
