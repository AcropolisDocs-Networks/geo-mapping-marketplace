use_when:
- Relief, a profile or a line of sight in Sweden at 1 m, with the person's own Geotorget login.
avoid_when:
- 'No login is registered: the chain passes it over (an INFO says so) and uses the Copernicus DEM.'
crs: EPSG:5845
delivery:
  mode: fetch
  url_template: https://dl1.lantmateriet.se/hojd/data/grid/mhm/{folder}/m{tile}.tif
  format: Cloud-Optimized GeoTIFF, EPSG:5845 (SWEREF99 TM + RH 2000)
  requires_credential:
    name: lantmateriet
    kind: basic
    class: secret
    host: dl1.lantmateriet.se
    inject:
      basic: true
    reject:
      status:
      - 401
      - 403
    signup_url: https://geotorget.lantmateriet.se/
    free: true
    limits: Free of charge (avgiftsfri) under CC BY 4.0; no quota stated on the pages read 2026-11-20.
  note: Items from https://api.lantmateriet.se/stac-hojd/v1/collections/dtm-cog/items?bbox=... (keyless); a data asset answered 401 without a login on 2026-11-20.
    At most 16 tiles a map.
source:
  publisher: Lantmäteriet
  product: Markhöjdmodell (dtm-cog)
  url: https://api.lantmateriet.se/stac-hojd/v1/collections/dtm-cog
