  changelog:
  - rev: 1
    date: '2026-11-04'
    note: 'Draft: download.geofabrik.de and overpass-api.de reset the connection from the build environment (2026-11-04), so no address could be verified
      here; the hosts are reachable from an ordinary workstation. The route and the ogr2ogr conversion are recorded; the plugin reads the converted GeoPackage,
      not the PBF.'
  - rev: 2
    date: '2026-11-07'
    note: 'Active: download.geofabrik.de answered from the user''s computer on 2026-11-07 (index-v1.json, 554 regions; the Arizona extract redirects to the current file). Still user-supplied: the plugin reads the converted GeoPackage, not the PBF.'
  - rev: 3
    date: '2026-11-25'
    note: 'Fetched and read by the plugin (5.4.0, open data portals P4.4). Verified in two halves on 2026-11-25. From the user''s computer (the Cowork sandbox):
      the region index answered 200 (522,918 bytes, 554 regions, 1.5 s); delaware-latest.osm.pbf handed off (307) to delaware-261124.osm.pbf and downloaded (22,290,527
      bytes, 19.7 s); liechtenstein likewise (3,527,490 bytes). In the build workspace, on those same files: the primary, trunk and motorway roads of all Delaware
      (a box of 1.2 square degrees, more than Overpass is asked for) read as 6,479 lines (1,853 km) in 2 s; every building, 113,246 polygons, in 10 s from the
      kept file; schools, hospitals, pillar hydrants and railways by four tag sets; and a map of the state''s main roads was built through the build from the kept
      extract (source.extract: us/delaware), credited to Geofabrik and OpenStreetMap. Not run as one piece inside the installed plugin: the cloud workspace cannot
      reach download.geofabrik.de, and the sandbox on the computer had no room to install the readers.'
