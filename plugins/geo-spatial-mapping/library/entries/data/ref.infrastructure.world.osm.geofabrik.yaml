use_when:
- 'Streets, buildings or points of interest by tag for a whole state or country, where the public Overpass API is for a city (a box over one square degree).'
- 'Several layers of one region: the extract is downloaded once and each set of tags is read from the kept file in seconds.'
- A road network for geo-ops distance work in a market where TIGER is too coarse or the market is outside the United States.
avoid_when:
- 'The file is above 800 MB (the United States, Germany, California): the read is refused and names the smaller regions inside it; name one.'
- 'The session runs only in the cloud workspace: download.geofabrik.de does not answer there; the fetch runs on your computer (the osm_fetch tool).'
- 'A small area or today''s edits are wanted: Overpass answers in seconds and is current to the minute; an extract is yesterday''s.'
- 'The output database is redistributed: ODbL share-alike applies to a derived database, and the map must credit OpenStreetMap contributors.'
pairs_with:
- ref.public-service.world.osm.overpass
crs: EPSG:4326
delivery:
  mode: fetch
  tool: osm_fetch
  format: .osm.pbf, one a region a day, read with GDAL's OSM driver (points, lines, multipolygons); written as GeoPackage layers points, lines, polygons
  note: 'In a MapSpec: source: {type: osm, tags: ["highway=primary", "highway=trunk"], extract: auto} (or extract: us/arizona). By tool: osm_fetch tags=...
    bbox=W,S,E,N extract=auto, first without confirm (the file and its size), then with confirm=true. By hand: geofabrik.py plan | fetch | regions. The
    region is the smallest whose US state or country meets the window, from the region index (index-v1-nogeom.json, 554 regions with ISO codes); a window over
    several states reads each (six at most). A file of 800 MB or more is refused with the regions inside it named. The extract is kept under
    .geo-mapping/cache/geofabrik/ for 30 days. Route relations (multilinestrings) are not read. A .osm.pbf you already have: geofabrik.py read FILE "tags"
    --bbox=... --out F.gpkg. The free GeoPackage and Shapefile zips Geofabrik also lists (506 regions) are not used: they did not answer from the Cowork
    sandbox on 2026-11-25 (no bytes in 100 s) while the .osm.pbf did, and the PBF exists for every region.'
