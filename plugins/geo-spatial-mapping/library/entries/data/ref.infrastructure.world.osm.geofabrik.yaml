id: ref.infrastructure.world.osm.geofabrik
type: infrastructure
rev: 3
status: active
title: OpenStreetMap extracts by state or country (Geofabrik)
summary: 'Daily OpenStreetMap extracts per continent, country and US state as .osm.pbf files from Geofabrik (554 regions). The region over the map''s window
  is downloaded once, kept 30 days, and the tags asked for are read from it for the box: the same layers an Overpass fetch gives, for areas Overpass does not take.'
