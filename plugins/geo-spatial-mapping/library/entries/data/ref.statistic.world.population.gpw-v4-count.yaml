  changelog:
  - rev: 1
    date: '2026-11-25'
    note: 'Draft (5.2.0, open data portals P2.4). Verified on 2026-11-25: the collection and its files are listed by the Common Metadata Repository with no key, and
      from the person''s computer the fetch plan for one file named data.earthdata.nasa.gov as the only host the token goes to. No file was downloaded: a
      download needs the person''s agreement to the plan, and an Earthdata forum thread reports access-denied answers for GPW files, so the entry is not
      offered until one download has succeeded. The copy on Harvard Dataverse asks for a guestbook form before each download, so it is not a route.'
