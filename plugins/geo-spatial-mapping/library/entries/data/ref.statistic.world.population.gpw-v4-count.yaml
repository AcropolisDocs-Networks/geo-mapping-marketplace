id: ref.statistic.world.population.gpw-v4-count
type: statistic
rev: 1
status: draft
title: 'Gridded Population of the World v4.11: population count, 2000 to 2020 (SEDAC, frozen)'
summary: 'People in each cell for 2000, 2005, 2010, 2015 and 2020, spread evenly inside each census unit with no modelling: GeoTIFF grids from 30 arc-seconds (about 1 km) to 1 degree.'
tags:
  geography: [world]
  level: [grid]
  domain: [demographics]
  use_for: [normalization, density-surface]
  avoid_for: [engineering-grade, legal-boundary, parcel-level, site-precision]
  scale: [world, national, regional]
  detail: [generalized]
  audience: [any]
  confidentiality: [public]
  freshness: [static]
  tier: [T2]
  license_class: [attribution]
  quality: [derived]
use_when:
- 'A population count is wanted that assumes nothing beyond the census (no settlement model), or the same method across 2000 to 2020.'
avoid_when:
- 'A local map: the count is spread evenly over each census unit, so cells inside a large unit all carry the same value (GHSL and WorldPop place people on built land).'
- 'A newer version is expected: NASA ended SEDAC''s contract on 30 April 2025. The data were restored in Earthdata Cloud on 17 June 2025 and are complete but frozen: no new versions.'
join:
  key: none
  type: raster
  note: 'No join: the value is read under polygons with a zonal sum (count) or mean (density).'
delivery:
  mode: fetch
  tool: earthdata
  short_name: CIESIN_SEDAC_GPWv4_POPCOUNT_R11
  concept_id: C3540918004-ESDIS
  format: GeoTIFF in a zip, EPSG:4326
  files: 'gpw-v4-population-count-rev11_{year}_{grain}_tif.zip (grain: 30_sec 405 MB, 2pt5_min 25 MB, 15_min, 30_min, 1_deg)'
  note: 'Fetched with the Earthdata tools and the person''s one token: earthdata_search (short_name=CIESIN_SEDAC_GPWv4_POPCOUNT_R11, kind=granules) lists the files, earthdata_fetch (urls=<one file>)
    shows the plan and downloads after the person agrees, into data/earthdata/CIESIN_SEDAC_GPWv4_POPCOUNT_R11/. The GeoTIFF inside the zip is then a file layer (role: raster) with
    this entry named in its provenance. Draft until one download has been made with a real token (see the changelog).'
source:
  publisher: 'NASA Socioeconomic Data and Applications Center (SEDAC), CIESIN, Columbia University'
  product: CIESIN_SEDAC_GPWv4_POPCOUNT_R11
