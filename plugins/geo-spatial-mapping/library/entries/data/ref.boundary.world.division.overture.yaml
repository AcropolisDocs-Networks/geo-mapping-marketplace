  - rev: 3
    date: '2026-11-25'
    note: 'Fetched for the map''s window (5.4.0, open data portals P4.1 and P2.8): release 2026-11-18.0. Verified from the build workspace on 2026-11-25: Kenya''s box (33.9,-4.7,41.9,5.1) read 2,405 areas of every level (161 MB in 37 requests, 25 s); subtype = ''region'' AND country = ''KE'' kept 50: 48 land areas (the 47 counties and the Elemi Triangle) and 2 maritime ones (Kwale and Lamu; add class = ''land'' to leave those out).'
