id: ref.boundary.world.division.overture
type: boundary
rev: 3
status: active
title: Overture Maps divisions (administrative areas)
summary: Countries, regions (states, provinces), counties and localities with names and hierarchy from the Overture divisions theme (division and division_area
  types), GeoParquet on S3.
tags:
  geography:
  - world
  level:
  - country
  - state
  - county
  - place
  domain:
  - general
  use_for:
  - choropleth
  - context-basemap
  - join-key
  - label-reference
  avoid_for:
  - engineering-grade
  - site-precision
  - legal-boundary
  scale:
  - world
  - national
  - regional
  - state
  detail:
  - detailed
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - monthly
  tier:
  - T2
  license_class:
  - share-alike
  quality:
  - community
use_when:
- A consistent world or multi-country admin hierarchy (country > region > county > locality) with one id scheme, for an international atlas.
- Locality polygons for cities outside the United States where no national file is at hand.
avoid_when:
- 'The map is of the United States, Canada or Mexico for a client: the national statistical agencies'' files carry the official codes.'
- 'Legal boundaries are implied: divisions come from OpenStreetMap and other open sources.'
distinct_from:
- id: ref.boundary.world.country.geoboundaries
  why: geoBoundaries cites an official source per country
- id: ref.boundary.world.state.ne10
  why: Natural Earth is generalized and public domain
- id: ref.boundary.world.admin.gadm41
  why: GADM is restricted-license
- id: ref.boundary.world.country.ne110
  why: bundled generalized countries
- id: ref.boundary.world.state.ne50
  why: bundled generalized admin-1
join:
  key: id
  type: string
  note: Overture GERS id; subtype (country, region, county, locality), country (ISO 3166-1 alpha-2), region (ISO 3166-2), names.primary. division_area holds
    the polygons, division the points and hierarchy.
crs: EPSG:4326
delivery:
  mode: fetch
  format: GeoParquet (S3), read for the map's window by HTTPS range request
  geometry: polygon
  window:
    reader: overture
    theme: divisions
    type: division_area
    release: 2026-11-18.0
    cap_mb: 400
    max_span_deg: 25
  columns: [id, name, subtype, class, country, region, admin_level, division_id, is_land, is_territorial]
  note: 'In a MapSpec: source: {type: ref, id: ref.boundary.world.division.overture, where: "subtype = ''region'' AND country = ''KE''"}; the build reads the
    window (window_read.py). Add class = ''land'': a coastal area is listed a second time as class maritime. subtype is country, dependency, region, county, localadmin, locality, macrohood, neighborhood or microhood; name one, or every
    level is drawn on top of the others. The points with population and the boundary lines (with is_disputed) are read by hand: overture_io.py read --release
    2026-11-18.0 --theme divisions --type division | division_boundary --bbox=W,S,E,N --out F.parquet.'
source:
  publisher: Overture Maps Foundation
  product: Overture divisions theme, release 2026-11-18.0
  url: https://overturemaps-us-west-2.s3.amazonaws.com/?list-type=2&prefix=release/2026-11-18.0/&delimiter=/
url_verified_on: '2026-11-25'
vintage:
  current: 2026-11-18.0
  cadence: monthly
license:
