id: ref.public-service.ca-bc.transit.translink
type: public-service
rev: 3
status: active
title: TransLink (Metro Vancouver) GTFS and GTFS-realtime
summary: Metro Vancouver bus, SkyTrain, SeaBus and West Coast Express schedules (GTFS) and real-time feeds from TransLink's open API, with a free key.
tags:
  geography:
  - ca-bc
  level:
  - site
  - line
  domain:
  - transport
  use_for:
  - site-map
  - context-basemap
  - coverage-footprint
  avoid_for:
  - engineering-grade
  - site-precision
  scale:
  - regional
  - metro
  - local
  audience:
  - any
  confidentiality:
  - public
  freshness:
  - irregular
  tier:
  - T2
  license_class:
  - restricted
  quality:
  - authoritative
use_when:
- A Vancouver SkyTrain or bus map from the static GTFS (no key), or live vehicle positions, trip updates and alerts with the person's own TransLink key
  (map-credentials add translink).
avoid_when:
- More than 1,000 real-time requests a day on one key.
- 'The older RTTI API: TransLink says it is deprecated.'
delivery:
  sample:
    request: positions
  mode: service
  format: GTFS (zip); GTFS-realtime (protobuf)
  requires_credential:
    name: translink
    kind: apikey
    class: secret
    host: gtfsapi.translink.ca
    inject:
      query: apikey
    reject:
      status:
      - 401
      - 403
    signup_url: https://developer.translink.ca/
    probe: https://gtfsapi.translink.ca/v3/gtfsalerts
    free: true
    limits: 1,000 requests a day per key (Open API Terms of Use, read 2026-11-15).
  requests:
    gtfs: https://gtfs-static.translink.ca/gtfs/google_transit.zip
    positions: https://gtfsapi.translink.ca/v3/gtfsposition
    trips: https://gtfsapi.translink.ca/v3/gtfsrealtime
    alerts: https://gtfsapi.translink.ca/v3/gtfsalerts
  read:
    format: file
    suffix: .pb
    requests:
      gtfs:
        suffix: .zip
        keyless: true
  note: 'Static GTFS needs no key (another host, sent without it). Real-time: gtfsposition, gtfsrealtime and gtfsalerts with the key as apikey (GTFS-realtime
    page, read 2026-11-22); without a key and with a made-up key the API answered 403 on 2026-11-22. The .pb file is read by gtfs.py vehicles.'
source:
  publisher: TransLink
  product: Open API (GTFS static and real-time)
  url: https://www.translink.ca/about-us/doing-business-with-translink/app-developer-resources
url_verified_on: '2026-11-22'
vintage:
  current: current GTFS
  cadence: irregular
license:
