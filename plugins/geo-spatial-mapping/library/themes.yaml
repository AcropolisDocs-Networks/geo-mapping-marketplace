    entries: [context.world.ground.overture, context.world.land.osm-simplified, context.us.landcover.nlcd, context.world.urban.ne10]
  hazards:
    says: "Floods, fires, earthquakes and storms"
    words: [hazard, hazards, flood, floodplain, fire, wildfire, earthquake, storm, storms, risk, resilience]
    entries: [context.us.hazard.fema-nfhl, public-service.world.hazard.nasa-firms, public-service.world.earthquake.usgs, statistic.us.storm-events.noaa]
  weather-climate:
    says: "Weather observations, forecasts and climate records"
    words: [weather, climate, temperature, rain, rainfall, precipitation, wind, forecast, normals, heat]
    entries: ["public-service.us.weather.*", public-service.world.weather.open-meteo, "public-service.world.weather.*", "public-service.*.weather.*",
              public-service.world.climate.copernicus-cds, "statistic.world.climate.*", statistic.us.climate.noaa-normals]
  night-lights-imagery:
    says: "Night lights, satellite and street-level pictures"
    words: [night lights, nightlights, lights at night, black marble, viirs, satellite, imagery, earth observation, street view, street-level]
    entries: [statistic.world.night-lights.black-marble, public-service.world.earth-observation.nasa-earthdata, basemap-provider.nasa-gibs, public-service.world.street-imagery.mapillary]
    note: "Black Marble and the other NASA Earthdata products need the person's Earthdata token, which is on their computer, not in the cloud workspace."
  energy:
    says: "Power lines, substations and energy statistics"
    words: [power, energy, transmission, substation, substations, grid, electricity, power lines]
    entries: [infrastructure.us.energy.transmission-lines, infrastructure.us.energy.substations, public-service.us.energy.eia-opendata]
  subsea-cables:
    says: "Submarine cables and landing points"
    words: [submarine cable, subsea cable, undersea cable, cables, landing point, landing station]
    entries: [infrastructure.world.submarine-cable.telegeography]
  places-names:
    says: "Place names and landforms"
