# The US states' and DC's own open data portals (5.1.0, open data portals spec P1.6, decision D3). Each row is a catalog root named
# state-<code>, asked when a map's place is in that state (catalog_search --sources auto). Every row was asked from the build workspace on the
# day shown (catalogs.py check --states); a row that did not answer stays here marked not-answering and is not searched. Counties and
# cities are not listed: add one with the portal adder (source_add portal=URL), which saves it among your own sources.
# `note` says when the portal is one agency's and not the state's clearinghouse: its results are that agency's layers only.
