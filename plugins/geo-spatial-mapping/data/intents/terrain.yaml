# An intent (5.0.0): a named kind of map. One word in the brief in place of a handful of switches, so the switches that belong together
# move together. `sets` are the MapSpec keys the intent sets (a default changed by an intent is explained); `needs` and `enrich` are data
# themes (library/themes.yaml); `outcome` is what the map is for unless the brief says otherwise; `checks_off` are findings that do not
# apply to this kind of map; `roles` suggests a layer role by geometry. gmap brief --intent <name> reads this file.
intent: terrain
says: 'The shape of the ground and what follows from it: relief, profiles, lines of sight, what a site can see.'
outcome: explain
sets:
  terrain.on: true
needs:
- elevation
enrich:
- buildings
- lidar
- water
- places-names
roles:
  polygon: polygons
  line: lines
  point: points
  raster: hillshade
checks_off: []
note: 'Bare earth sees more than is there: with buildings in the way, use a surface that holds them and say which was used.'
